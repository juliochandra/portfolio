conversation:
  - { id: Q001, question: "Portfolio ini untuk profesi atau bidang apa?", answer: "Developer / programmer." }
  - { id: Q002, question: "Apa tujuan utama portfolio ini?", answer: "Dilirik perusahaan (melamar kerja)." }
  - { id: Q003, question: "Siapa yang paling diharapkan membuka website ini?", answer: "HRD / recruiter perusahaan." }
  - { id: Q004, question: "Hal apa yang diharapkan terjadi berkat portfolio ini?", answer: "Dipanggil interview, menonjol dibanding kandidat lain, dan punya identitas online yang rapi." }
  - { id: Q005, question: "Apa saja yang ingin ditampilkan di website ini?", answer: "HOME, ABOUT, PORTFOLIO, BLOG, CONTACT. Untuk admin: CMS lengkap." }
  - { id: Q006, question: "Konten apa saja yang ingin bisa dikelola sendiri lewat halaman admin?", answer: "Semua konten (project, blog, profil, kontak)." }
  - { id: Q007, question: "Ada halaman/bagian lain yang belum dibahas?", answer: "Download CV." }
  - { id: Q008, question: "Adakah fitur yang dipastikan TIDAK termasuk tahap ini?", answer: "Komentar di blog, dua bahasa, newsletter — dan tidak ada pengecualian lain ('Tidak ada' ikut dipilih, dimaknai sebagai penutup daftar; dikonfirmasi ulang di ringkasan)." }
  - { id: Q009, question: "Konten website memakai bahasa apa?", answer: "Bahasa Indonesia." }
  - { id: Q010, question: "Adakah batasan/keinginan khusus lain?", answer: "Nyaman dibuka dari HP; mudah ditemukan di Google." }
  - { id: Q011, question: "Hal apa yang membuat website ini terasa berhasil?", answer: "Dipanggil interview, bisa update konten mandiri, muncul di Google saat nama dicari." }
  - { id: Q012, question: "Ada warna/gaya tampilan tertentu atau referensi?", answer: "Terinspirasi warna di github.com; gunakan light dan dark mode; gaya profesional dan simple." }
  - { id: Q013, question: "Halaman Contact sifatnya bagaimana?", answer: "Keduanya — menampilkan info kontak dan ada formulir kirim pesan." }
  - { id: Q014, question: "Bagaimana Anda ingin menerima pesan dari formulir Contact? (siklus revisi — Gap Report BA G-001)", answer: "Kotak masuk di halaman admin." }
  - { id: Q015, question: "Selain perkenalan singkat, apa saja yang ingin ditonjolkan di halaman Home? (siklus revisi — client menilai rincian Home terlalu tipis)", answer: "Hero, skill, cuplikan portfolio, blog terbaru, CTA (istilah client sendiri)." }

