gap_list:
  - { id: G-001, question: "17 Route Handler + 21 Server Action menjadi berapa issue backend?", blocking: false, to: null,
      resolution: "Dikelompokkan per fitur, bukan per EP/SA individual: 8 migrasi entitas (satu per entitas — tidak ada yang digabung, beda dari v1.0 lama karena ContactInfo kini sudah flat single-table sendiri, tak perlu digabung ContactLink lagi), 1 auth+password, 4 kelompok publik (Portfolio/Blog/Contact/Keahlian), 7 kelompok kelola (satu per entitas yang py CRUD admin: Project/Tulisan/Keahlian/InfoKontak/Pesan/Tag/Media), 1 Dashboard — 21 issue BE. Endpoint & Server Action serumpun (list-read + create/update/delete satu fitur) satu issue — satu-satu jadi remeh (04 §3.2, §5).", status: resolved }
  - { id: G-002, question: "Auth (EP-07/EP-08) & ubah kata sandi (SA-21) satu issue atau dipisah?", blocking: false, to: null,
      resolution: "Digabung (ISS-012) — sama-sama domain sesi/kredensial User (ENT-08); changePassword cuma 1 Server Action kecil, remeh bila berdiri sendiri (04 §5, 'jangan remeh').", status: resolved }
  - { id: G-003, question: "Fondasi tampilan (layout publik + kerangka admin) satu issue untuk kedua sisi, atau dipisah?", blocking: false, to: null,
      resolution: "Satu issue (ISS-025) — token warna/tipografi/spacing & sebagian komponen (TombolUtama, FormIsian, DialogKonfirmasi, PesanStatus, SaklarTema) dipakai identik lintas sisi; MenuAdmin (C-10) meski kini lebih berat (grouped, label Inggris) tetap satu kerangka admin yang sama dipakai 11 layar kelola — memisahkannya menduplikasi pekerjaan token yang sama (pola sama G-003 versi lama, tetap berlaku).", status: resolved }
  - { id: G-004, question: "Layar Masuk (SCR-08) & Dashboard (SCR-09) satu issue atau dipisah? (v1.0 lama menggabungkannya)", blocking: false, to: null,
      resolution: "DIPISAH — beda dari precedent lama. Dashboard kini py konten substantif (KartuStatistik C-18, BarisRingkasan C-19, PintasanAksi C-21, panggil EP-16) sejak referensi desain admin client (pm_01 D009), bukan lagi kerangka kosong berisi daftar pintasan. Masuk (SCR-08) tetap layar kecil berdiri sendiri (D-004).", status: resolved }
  - { id: G-005, question: "SCR-01 Home menampilkan bagian Keahlian ke pengunjung publik (AC-019-1), tapi satu-satunya endpoint baca Skill yang ada (EP-11) khusus admin — pekerjaan FE Home tidak bisa didefinisikan tanpa jalur baca publik.", blocking: true, to: techlead,
      resolution: "DIPERBAIKI dalam siklus yang sama — Tech Lead menambah EP-17 (GET /api/skills, publik) di techlead_03_api_contract.md v2.3 (D-016 techlead_01). Ikut ditemukan & diperbaiki: bug wireframe SCR-01 (leftover 'Selengkapnya di About', tautan ke halaman yang sudah tidak menampilkan keahlian sejak D-009) — uiux_02_wireframe.md v1.8 (D-015 uiux).", status: resolved }
  - { id: G-006, question: "Migrasi 8 entitas: perlu saling blocked_by karena ada relasi m-n implisit (Project↔Tag, Project↔Skill, Post↔Tag)?", blocking: false, to: null,
