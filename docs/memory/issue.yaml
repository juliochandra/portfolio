  - { id: D-013, decision: "CI/CD & kerangka deploy ditunda ke akhir sebagai Titipan TANPA nomor issue (G-009) — bukan issue setup bernomor rendah yang 'dikerjakan belakangan'. ISS-001 dilucuti bagian GitHub Actions CI (Serves kehilangan 'CI/CD'); ISS-003 lama ('Kerangka deploy: Docker Compose, Caddy, Cloudflare & bucket R2', size M) DIPERSEMPIT total jadi 'Bucket Cloudflare R2 (sandbox)' saja (size M→S, file di-rename ISS-003-bucket-cloudflare-r2.md, Serves Container/Hosting/Environment&Deployment dilepas — cuma sisa Penyimpanan Berkas)", reason: "Permintaan eksplisit user: sedang mengembangkan lokal, jangan menambah kerjaan yang seharusnya di akhir. TIDAK direalisasikan sebagai issue baru bernomor akhir (mis. ISS-041) karena melanggar Hard Rule framework 'nomor ISS lintas fase tidak pernah saling menyalip' (03_PIPELINE §221, 06_VALIDATION §113) — fase setup tidak boleh muncul bernomor setelah backend/frontend. R2 SENGAJA dikecualikan dari penundaan (tetap ISS-003 di awal) karena ia layanan cloud terkelola yang dipakai fitur unggah selama pengembangan lokal (setara Neon ISS-002), beda kategori dari Docker/Caddy/Cloudflare-CDN/GitHub-Actions yang murni tooling deployment — tanpa target deploy sungguhan, tooling itu tidak berguna sekarang", time: "2026-07-17" }
