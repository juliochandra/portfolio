project:
  id: PRJ-001
  title: "Portfolio Developer"
  source: "set BA (FEATURE + USER_STORY + ACCEPTANCE_CRITERIA) + set UI/UX (USER_FLOW + WIREFRAME + DESIGN_SYSTEM)"
  source_versions: { ba: "6.0", uiux: "1.8" }
  context: "docs/pm_01_project.md v1.6"
  status: done   # v2.7 — v2.0: revisi total dari v1.0 (perancangan skema lanjutan, pm_01 D008): 8 entitas, Server Action untuk mutasi admin, Profil dihapus total. v2.1: skema Prisma tanpa @map/@@map (D-014). v2.2: referensi desain admin client (pm_01 D009) — Tag & Media dapat CRUD/kelola penuh, changePassword baru, dashboard stats endpoint (D-015), tanpa tabel baru. v2.3: EP-17 GET /api/skills (publik) — celah kontrak ditemukan Issue Planner (D-016). v2.4: penyimpanan berkas pindah filesystem-lokal → Cloudflare R2 (D-017) — perubahan kapabilitas tim (TEAM_STACK.md diperbarui), tanpa endpoint/kontrak baru. v2.5: 5 layar publik dibungkus route group app/(public)/ (D-018) — layout Navbar+Footer bersama; sekalian fix referensi EP-01..EP-16 basi → EP-01..EP-17. v2.6: login/ dipindah keluar dari admin/ ke app/login/ (D-019) — UI sendiri, admin/layout.tsx (MenuAdmin) kini berlaku utuh tanpa pengecualian. v2.7: folder core/ diganti nama jadi shared/ (D-020) — rename murni, permanen di TEAM_STACK.md. v2.8: EP-07 (login) & EP-08 (logout) dicabut sebagai Route Handler, digantikan SA-22/SA-23 (Server Action) — D-021, permintaan eksplisit user; Route Handler kini murni baca (publik & admin), tanpa pengecualian auth; ISS-012 & ISS-004 di docs/issues/ disesuaikan manual. 4 dokumen diserahkan ke Issue Planner / FE & BE — Tech Lead berhenti

