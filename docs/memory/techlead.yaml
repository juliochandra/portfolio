gap_list:
  - { id: G-001, question: "Berkas CV belum tentu tersedia saat AC-017-1 dituntut (tombol Unduh CV) — apa yang terjadi bila kosong?",
      blocking: false, to: null,
      resolution: "DIREVISI (2026-07-16, pm_01 D007): CV bukan lagi data DB — aset statis, ditempel developer ke public/ sebelum situs tayang publik. Resolusi awal (cv_file NOT NULL di skema Profil) sudah tidak berlaku karena Profil dihapus total",
      status: resolved }
  - { id: G-002, question: "Urutan daftar Project di halaman Portfolio tidak disebut eksplisit oleh BA/UI-UX",
      blocking: false, to: null,
      resolution: "Default: publishedAt terbaru dulu, hanya status PUBLISHED (Assumption BA A-002, direvisi pm_01 D008)",
      status: resolved }
  - { id: G-003, question: "Batas ukuran & jenis berkas unggahan (gambar) tidak disebut",
      blocking: false, to: null,
      resolution: "Default wajar: gambar (jpg/png/webp) ≤ 2MB — mekanisme teknis dalam batas requirement. Ketentuan CV ≤5MB v1.0 dicabut (CV tidak lagi diunggah lewat admin, pm_01 D007)",
      status: resolved }
  - { id: G-004, question: "Durasi sesi masuk admin (access/refresh token) tidak disebut dokumen hulu",
      blocking: false, to: null,
      resolution: "Default standar: token akses 15 menit, token pembaruan 7 hari, disimpan sebagai httpOnly cookie; berlaku juga untuk verifikasi ulang di dalam tiap Server Action (D-012)",
      status: resolved }
  - { id: G-005, question: "Bagaimana admin memicu perubahan status Draf/Terbit/Arsip pada Project/Tulisan di lapisan data?",
      blocking: false, to: null,
      resolution: "Satu Server Action update* menerima field status, memvalidasi & menyimpan; publishedAt diisi sekali saat pertama kali menyentuh PUBLISHED (G-011 BA)",
      status: resolved }
  - { id: G-006, question: "ID entitas: BigInt autoincrement (v1.0) atau string cuid?",
      blocking: false, to: null,
      resolution: "cuid() string — id tidak bisa ditebak/dienumerasi lewat manipulasi URL; berpasangan wajar dengan slug yang sudah dipakai di seluruh entitas berkonten (D-008)",
      status: resolved }
  - { id: G-007, question: "Server Action untuk seluruh mutasi admin, atau hanya Project seperti permintaan awal user?",
      blocking: false, to: null,
      resolution: "Global — seluruh mutasi admin (Project/Post/Skill/ContactInfo/Message) jadi Server Action, bukan hanya Project, untuk konsistensi pola di seluruh fitur admin; Route Handler dipertahankan untuk baca & autentikasi (D-012)",
      status: resolved }
  - { id: G-008, question: "Tag & Media dapat CRUD/kelola penuh (referensi desain admin client) — perlu tabel/kolom baru?",
      blocking: false, to: null,
      resolution: "Tidak — Tag & Media sudah ada sejak v2.0; hanya ditambah permukaan Route Handler baca (EP-14/EP-15) + Server Action mutasi (SA-16..20). Project/Post beralih dari upsert-by-name Tag jadi pilih tagIds dari daftar",
      status: resolved }
  - { id: G-009, question: "Bagaimana bentuk endpoint statistik Dashboard (SCR-09) — satu endpoint agregat, atau client menghitung dari beberapa GET list?",
      blocking: false, to: null,
      resolution: "Satu endpoint agregat (EP-16 GET /api/admin/dashboard) — menghindari client memuat seluruh Project/Post hanya untuk menghitung total; murni pemanis, tanpa AC (G-009 uiux)",
      status: resolved }
  - { id: G-010, question: "changePassword — server action terpisah, atau bagian dari updateUser generik?",
      blocking: false, to: null,
      resolution: "Server Action khusus (changePassword) dengan payload oldPassword/newPassword/confirmPassword — User cuma py 2 field (username, passwordHash), tidak ada kebutuhan update generik lain",
      status: resolved }

assumption_list:
  - { id: A-001, assumption: "CV adalah aset statis di public/, bukan data DB — situs tidak tayang publik tanpanya (DIREVISI 2026-07-16, pm_01 D007)", gap: G-001, status: documented }
  - { id: A-002, assumption: "Daftar Project & Tulisan publik terbaru dulu (publishedAt desc), hanya status PUBLISHED", gap: G-002, status: documented }
  - { id: A-003, assumption: "Batas unggahan: gambar ≤2MB (jpg/png/webp); tanpa ketentuan CV (dicabut)", gap: G-003, status: documented }
  - { id: A-004, assumption: "Token akses 15 menit, token pembaruan 7 hari, httpOnly cookie; diverifikasi ulang di tiap Server Action", gap: G-004, status: documented }
  - { id: A-005, assumption: "Status Draf/Terbit/Arsip diubah lewat Server Action update* yang sama dengan create*, satu field status di payload", gap: G-005, status: documented }
  - { id: A-006, assumption: "Seluruh id entitas memakai cuid() string, bukan BigInt autoincrement", gap: G-006, status: documented }
  - { id: A-007, assumption: "Server Action dipakai global untuk seluruh mutasi admin (bukan hanya Project), Route Handler untuk baca & auth", gap: G-007, status: documented }
  - { id: A-008, assumption: "Tag & Media memakai tabel yang sudah ada (v2.0), hanya menambah permukaan Route Handler/Server Action baru — tanpa migrasi skema", gap: G-008, status: documented }
  - { id: A-009, assumption: "Dashboard (SCR-09) dilayani satu endpoint agregat (EP-16), bukan client menghitung dari beberapa GET list", gap: G-009, status: documented }
  - { id: A-010, assumption: "changePassword adalah Server Action khusus, terpisah dari update generik (User tidak punya field lain untuk diubah)", gap: G-010, status: documented }

decision_log:
  - { id: D-001, decision: "Kelas proyek: CMS ringan (monolith server-rendered), bukan situs statis",
      reason: "Objective pm_01_project.md eksplisit menuntut 'kendali penuh memperbarui seluruh isinya sendiri' — pemilik ADALAH Target User (Admin)",
      time: "2026-07-15" }
  - { id: D-002, decision: "~~TEAM_STACK.md dipakai apa adanya untuk seluruh layer kecuali penyimpanan berkas~~ — DICABUT v2.4 (D-017): TEAM_STACK.md kini mencakup penyimpanan berkas (Cloudflare R2)",
      reason: "Berlaku v2.0-v2.3: validasi cakupan waktu itu terhadap system_inventory — stack baku tim memenuhi seluruh kapabilitas kecuali penyimpanan berkas unggahan; celah itu ditutup user langsung di TEAM_STACK.md, bukan lagi penyimpangan proyek",
      time: "2026-07-15" }
  - { id: D-003, decision: "Struktur folder = jalur 1 (Struktur Folder Baku TEAM_STACK.md)",
      reason: "TEAM_STACK.md menyediakan kerangka feature-based layered baku; pekerjaan Tech Lead murni memetakan F-XX ke folder fitur (04 §8.1 jalur 1)",
      time: "2026-07-15" }
  - { id: D-004, decision: "DICABUT total v2.0 (D-013) — Profil & Info Kontak singleton tidak berlaku lagi",
      reason: "Profil dihapus sepenuhnya (bukan tabel sama sekali, pm_01 D007); Info Kontak jadi multi-baris CRUD penuh, bukan singleton",
      time: "2026-07-15, dicabut 2026-07-16" }
  - { id: D-005, decision: "Pesan tanpa endpoint ubah isi/hapus — v2.0 menambah Server Action ubah status (baca/arsip)",
      reason: "US-018 hanya menuntut 'membaca'; endpoint ubah isi/hapus = endpoint hantu (Scope Validation); status baca/arsip = kemampuan baru pm_01 D008, bukan ubah isi",
      time: "2026-07-15, diperluas 2026-07-16" }
  - { id: D-006, decision: "Sorotan Home memakai endpoint yang sama dengan daftar penuh Portfolio/Blog (EP-01/EP-03), dibedakan parameter `limit`",
      reason: "Data & aturan identik (project/tulisan terbaru berstatus Terbit) — endpoint terpisah untuk kebutuhan yang sama = duplikasi tanpa alasan",
      time: "2026-07-15" }
  - { id: D-007, decision: "AC-001-4 (muncul di pencarian Google) ditopang lewat Server-Side Rendering + metadata + sitemap.xml — bukan endpoint",
      reason: "Kebutuhan kualitas 'mudah ditemukan Google' adalah keputusan arsitektur (rendering + meta), bukan permukaan API",
      time: "2026-07-15" }
  - { id: D-008, decision: "ID seluruh entitas: String @default(cuid()), bukan BigInt autoincrement() (v1.0)",
      reason: "Id tidak bisa ditebak/dienumerasi lewat manipulasi URL; berpasangan wajar dengan slug yang sudah dipakai di seluruh entitas berkonten; keputusan user saat perancangan skema",
      time: "2026-07-16" }
  - { id: D-009, decision: "ContactInfo & User tanpa kolom createdAt/updatedAt, beda dari entitas lain",
      reason: "Skala 1 baris/1 akun; tidak ada kebutuhan produk/UI yang menampilkan riwayat perubahan keduanya",
      time: "2026-07-16" }
  - { id: D-010, decision: "Slug (projects, posts, tags, skills) dibuat otomatis dari nama/judul (slugify), bukan isian manual admin",
      reason: "Admin tunggal non-teknis; auto-generate menghindari slug kosong/bentrok tanpa validasi form tambahan",
      time: "2026-07-16" }
  - { id: D-011, decision: "Media = katalog metadata file, bukan foreign key relasional dari projects/posts",
      reason: "Skala kecil (1 admin, unggahan jarang) tidak sepadan dengan kompleksitas menjaga relasi FK tetap sinkron",
      time: "2026-07-16" }
  - { id: D-012, decision: "Seluruh mutasi admin (create/update/delete, transisi status) jadi Server Action; Route Handler untuk baca (publik & admin) + auth",
      reason: "Permintaan eksplisit user saat perancangan skema; mutasi dipanggil langsung dari form admin, tidak butuh permukaan REST terpisah",
      time: "2026-07-16" }
  - { id: D-013, decision: "Entitas Profil dihapus total (bukan lagi tabel); Info Kontak jadi tabel flat multi-baris dengan CRUD penuh (mencabut D-004)",
      reason: "pm_01 D007 (Profil statis) + pm_01 D008 lanjutan (perancangan skema) — data identitas jarang berubah, tidak sepadan jadi form admin; Info Kontak sebaliknya perlu fleksibel tambah/kurang saluran tanpa migrasi skema",
      time: "2026-07-16" }
  - { id: D-014, decision: "Skema Prisma TANPA @map/@@map — konvensi default Prisma apa adanya (model PascalCase singular = nama tabel, field camelCase = nama kolom)",
      reason: "Proyek tidak pernah mengakses PostgreSQL secara langsung di luar Prisma Client (tanpa raw SQL/tool eksternal/BI) — lapisan pemetaan nama snake_case tidak punya manfaat terukur untuk skala ini; keputusan user, mencabut konvensi snake_case v2.0",
      time: "2026-07-16" }
  - { id: D-015, decision: "Tag & Media (sudah ada sejak v2.0) dapat permukaan CRUD/kelola admin penuh (EP-14/SA-16..18 Tag; EP-15/SA-19..20 Media), menggantikan pola inline-only/write-only; changePassword (SA-21) baru; GET /api/admin/dashboard (EP-16) baru untuk statistik & aktivitas terbaru — tanpa tabel baru; folder fitur baru features/tags, features/media, features/dashboard",
      reason: "Referensi desain admin eksplisit dari client (docs/ui/cms/, pm_01 D009) — bukan tebakan tim; Tag/Media/User.passwordHash sudah cukup di skema v2.0/v2.1, hanya butuh permukaan API/UI baru",
      time: "2026-07-16" }
  - { id: D-016, decision: "GET /api/skills (EP-17, publik) ditambahkan v2.3",
      reason: "Celah kontrak ditemukan Issue Planner saat memecah backlog FE Home (SCR-01): bagian Keahlian tampil ke publik (AC-019-1) tapi satu-satunya endpoint baca Skill yang ada (EP-11) khusus admin — gap blocking, diperbaiki di sini sebelum Issue Planner lanjut. Juga memicu perbaikan bug terkait di UI/UX (uiux_02 v1.8 D-015 — leftover tautan 'Selengkapnya di About' pada SCR-01 Keahlian)",
      time: "2026-07-16" }
  - { id: D-017, decision: "Penyimpanan berkas pindah dari filesystem lokal (volume Docker) ke Cloudflare R2 (S3-compatible object storage); mencabut D-002. Alur unggah TETAP lewat Server Action (D-012 tidak berubah) — file dikirim FormData ke Server Action yang sama (createProject/createPost/uploadMedia), Server Action-nya yang mengunggah ke R2 lewat S3 SDK di lapisan infrastructure/shared (v2.7 D-020: rename dari core) — tanpa endpoint/kontrak API baru, tanpa presigned URL client-langsung (dipertimbangkan & ditolak user demi kesederhanaan skala 1 admin)",
      reason: "Perubahan kapabilitas tim (bukan requirement proyek) — user memperbarui TEAM_STACK.md menambah Penyimpanan Berkas: Cloudflare R2; R2 menghapus kebutuhan volume Docker terpisah, tanpa biaya egress, terintegrasi dengan Cloudflare yang sudah dipakai sebagai CDN",
      time: "2026-07-17" }
  - { id: D-018, decision: "Kelima layar publik (SCR-01..07) dibungkus route group app/(public)/ (techlead_04 v2.5) — satu layout.tsx bersama (MenuUtama C-02 + Footer) tanpa mengubah URL; admin/ TETAP folder biasa (path /admin/* nyata, dilindungi middleware.ts); SCR-08 Masuk sengaja tidak ikut berbagi layout admin (wireframe-nya tidak punya bagian Header Admin). Turut diperbaiki: referensi EP-01..EP-16 basi di techlead_04 (seharusnya EP-01..EP-17 sejak v2.3) — leftover yang lolos cascade sebelumnya",
