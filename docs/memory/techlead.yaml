tech_stack:
  - { layer: framework, choice: "Next.js 15 (App Router)", source: team_stack, reason: "Stack baku tim, mencakup seluruh kapabilitas inventory", constraints: [] }
  - { layer: ui_library, choice: "React 19", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: bahasa, choice: "TypeScript 7 (strict mode)", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: styling, choice: "Tailwind CSS 4", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: runtime, choice: "Node.js 22 (LTS)", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: api, choice: "Route Handlers (baca) + Server Actions (seluruh mutasi admin + autentikasi)", source: team_stack,
      reason: "Stack baku tim; v2.0 membagi jelas: Route Handler untuk GET publik/admin, Server Action untuk create/update/delete/transisi-status admin (D-012) — permintaan eksplisit user. v2.8 (D-021): login/logout turut pindah dari Route Handler (EP-07/EP-08 lama) ke Server Action (SA-22/SA-23) — dipanggil langsung dari form SCR-08/tombol SCR-09, konsisten pola form→action seluruh admin lain; Route Handler kini murni baca (publik & admin), tanpa pengecualian", constraints: [] }
  - { layer: database, choice: "PostgreSQL 18 (Neon)", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: orm, choice: "Prisma 7", source: team_stack, reason: "Stack baku tim; skema deklaratif = kontrak techlead_02 (07 §3.1); id String cuid() di seluruh model (D-008)", constraints: [] }
  - { layer: auth, choice: "JWT (Access + Refresh Token) + Bcrypt", source: team_stack, reason: "Stack baku tim; cukup untuk 1 akun admin (F-06.1); sesi diverifikasi ulang di tiap Server Action (D-012) — kecuali login (SA-22, D-021) yang justru membuat sesi baru, bukan memverifikasi yang sudah ada", constraints: [] }
  - { layer: validasi, choice: "Zod 4", source: team_stack, reason: "Stack baku tim; schema diturunkan 1:1 dari shape techlead_03 (Route Handler & Server Action)", constraints: [] }
  - { layer: form, choice: "React Hook Form 7", source: team_stack, reason: "Stack baku tim; form admin memanggil Server Action lewat action prop", constraints: [] }
  - { layer: test, choice: "Vitest 4 (unit) + Playwright 1 (E2E)", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: cicd, choice: "GitHub Actions", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: linter, choice: "Biome 2", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: container, choice: "Docker Engine 29 + Docker Compose 2", source: team_stack, reason: "Stack baku tim", constraints: [] }
  - { layer: hosting, choice: "Ubuntu LTS 22/24 + Caddy 2 (reverse proxy) + Cloudflare (CDN & security)", source: team_stack, reason: "Stack baku tim; Caddy = HTTPS otomatis, menopang kebutuhan kualitas 'mudah ditemukan Google' (AC-001-4)", constraints: [] }
  - { layer: storage, choice: "Cloudflare R2 (S3-compatible object storage)", source: team_stack,
      reason: "v2.4 (D-017) — TEAM_STACK.md diperbarui user, kini mencakup penyimpanan berkas; mencabut penyimpangan filesystem-lokal v2.0-v2.3 (D-002). Alur unggah tetap lewat Server Action (createProject/createPost/uploadMedia, D-012 tidak berubah) — Server Action yang memanggil S3 SDK ke R2 di lapisan infrastructure/shared (v2.7 D-020: rename dari core), bukan endpoint/presigned-URL terpisah (opsi itu dipertimbangkan & ditolak user demi kesederhanaan skala 1 admin). v2.0: hanya gambar unggahan admin (thumbnail project/tulisan) — CV TIDAK lewat R2, ditempel developer ke public/ (pm_01 D007)",
      constraints: ["Kebutuhan Aset uiux_03_design_system.md: thumbnail project, thumbnail tulisan"] }

architecture:
  pattern: "monolith server-rendered (CMS ringan) — sisi publik + sisi admin terlindung dalam satu aplikasi Next.js"
  modules: ["sisi publik (Home, About statis, Portfolio, Blog, Contact)", "sisi admin terlindung (kelola project/tulisan/keahlian/info kontak/pesan)", "penyimpanan berkas (gambar unggahan, Cloudflare R2 v2.4)"]
  deployment: "satu image Next.js dijalankan via Docker Compose (aplikasi + PostgreSQL) di VPS Ubuntu; Caddy reverse proxy di depan aplikasi, Cloudflare di depan Caddy; berkas unggahan admin ke Cloudflare R2 (v2.4, tanpa volume Docker terpisah); deploy via GitHub Actions build & push; berkas CV disertakan dalam image (public/), tidak lewat R2"
  structure:
    style: "feature-based layered (Clean Architecture) — Struktur Folder Baku TEAM_STACK.md"
    source: team_stack
    folders:
      - { path: "src/features/projects", layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-01.2, F-03, F-06.2] }
      - { path: "src/features/posts",    layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-01.2, F-04, F-06.3] }
      - { path: "src/features/skills",   layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-01.2, F-06.4] }  # v2.3: + EP-17 baca publik (D-016)
      - { path: "src/features/tags",     layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-06.8] }
      - { path: "src/features/media",    layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-06.9] }
      - { path: "src/features/contact",  layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-05.1, F-06.5] }
      - { path: "src/features/messages", layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-05.2, F-06.7] }
      - { path: "src/features/auth",     layer: "domain · application (+ Server Action) · infrastructure · presentation", serves: [F-06.1, F-06.6, F-06.10] }
      - { path: "src/features/dashboard", layer: "application (query agregat) · presentation", serves: ["SCR-09 (pemanis, non-blocking)"] }
      - { path: "src/app", layer: "presentation (route App Router + Route Handlers)", serves: ["SCR-01..SCR-19", "EP-01..EP-17"] }
      - { path: "src/app/(public)", layer: "presentation — route group Next.js (tanpa efek URL), layout.tsx bersama Navbar+Footer, v2.5 D-018", serves: ["SCR-01..SCR-07"] }
      - { path: "src/app/login", layer: "presentation — halaman berdiri sendiri, UI form sendiri, dipindah keluar dari admin/ v2.6 D-019", serves: ["SCR-08"] }
      - { path: "src/app/admin", layer: "presentation — layout.tsx MenuAdmin (C-10) berlaku utuh tanpa pengecualian sejak login dipindah, v2.6 D-019", serves: ["SCR-09..SCR-19"] }
      - { path: "src/shared", layer: "shared lintas fitur (ui dasar, config, klien Prisma, util auth, util penyimpanan berkas — S3 SDK ke Cloudflare R2, v2.4)", serves: ["lintas fitur"] }  # v2.7 D-020: rename dari src/core
      - { path: "src/middleware.ts", layer: "penjaga route /admin/* (verifikasi JWT)", serves: ["F-06 (semua sub-fitur)"] }
      - { path: "public/", layer: "aset statis (termasuk CV)", serves: ["F-07"] }

entities:
  - id: ENT-01
    name: "Project"
    table: "Project"
    serves: [F-01.2, F-03, F-06.2, US-003, US-004, US-010, US-011, US-019]
    fields:
      - { name: id,             type: id,      required: true, note: "cuid() — D-008" }
      - { name: title,          type: teks,    required: true, note: "AC-010-2: wajib" }
      - { name: slug,           type: teks,    required: true, note: "unik; auto dari title — D-010" }
      - { name: description,    type: teks,    required: false, note: "gambaran singkat — AC-003-1; divalidasi wajib di Zod, bukan NOT NULL skema (AC-010-2)" }
      - { name: content,        type: teks-panjang, required: true, note: "deskripsi lengkap; dapat memuat 'peran saya' (G-013 BA)" }
      - { name: demoUrl,        type: teks,    required: false, note: "tampil hanya bila ada (AC-004-1)" }
      - { name: repositoryUrl,  type: teks,    required: false, note: "'Tautan kode' di UI; tampil hanya bila ada (AC-004-1)" }
      - { name: thumbnailImage, type: berkas, required: false, note: "opsional" }
      - { name: status,         type: "enum(PublishStatus)", required: true, note: "DRAFT default — pm_01 D008" }
      - { name: publishedAt,    type: tanggal, required: false, note: "diisi sekali saat pertama PUBLISHED, tidak berubah lagi" }
    relations: ["m-n implisit ke Tag (ENT-03)", "m-n implisit ke Skill (ENT-04)"]
    rules: ["hanya status PUBLISHED tampil publik, urut publishedAt desc; daftar admin urut createdAt desc (AC-003-1, AC-003-2)",
            "penghapusan bersifat permanen (hard delete), selalu setelah konfirmasi UI, terpisah dari ARCHIVED (Assumption BA A-003, direvisi)"]
  - id: ENT-02
    name: "Tulisan"
    table: "Post"
    serves: [F-01.2, F-04, F-06.3, US-005, US-006, US-012, US-013, US-019]
    fields:
      - { name: id,             type: id,      required: true, note: "cuid() — D-008" }
      - { name: title,          type: teks,    required: true, note: "AC-012-2: wajib" }
      - { name: slug,           type: teks,    required: true, note: "unik; auto dari title — D-010" }
      - { name: description,    type: teks,    required: false, note: "cuplikan, tampil di ItemTulisan" }
      - { name: content,        type: teks-panjang, required: true, note: "isi tulisan" }
      - { name: readingTime,    type: angka,   required: true, note: "dihitung sekali saat create/update dari content — tidak dihitung ulang tiap dibaca" }
      - { name: thumbnailImage, type: berkas, required: false, note: "opsional — thumbnail kanan list (C-05) & pratinjau share; TIDAK tampil di isi tulisan" }
      - { name: status,         type: "enum(PublishStatus)", required: true, note: "DRAFT default — pm_01 D008" }
      - { name: publishedAt,    type: tanggal, required: false, note: "diisi sekali saat pertama PUBLISHED, tidak berubah saat diedit" }
    relations: ["m-n implisit ke Tag (ENT-03)"]
    rules: ["hanya status PUBLISHED tampil publik, urut publishedAt desc, tanpa kategori (Assumption BA A-002, tag melengkapi tanpa mengubah tampilan)",
            "penghapusan bersifat permanen (hard delete), selalu setelah konfirmasi UI, terpisah dari ARCHIVED"]
  - id: ENT-03
    name: "Tag"
    table: "Tag"
    serves: [F-03, F-04, F-06.8, US-021]
    fields:
      - { name: id,        type: id,   required: true, note: "cuid()" }
      - { name: name,      type: teks, required: true, note: "unik — AC-021-1" }
      - { name: slug,      type: teks, required: true, note: "unik; auto dari name; disiapkan, belum ada route yang memakainya" }
    relations: ["m-n implisit ke Post (ENT-02)", "m-n implisit ke Project (ENT-01)"]
    rules: ["CRUD penuh lewat SCR-17 (EP-14, SA-16..18) — mencabut G-014 BA lama 'inline-only, tanpa halaman kelola' (pm_01 D009, referensi desain admin client)",
            "Project/Post memilih tagIds dari daftar yang ada (pola sama skillIds), bukan lagi upsert-by-name",
            "menghapus tag yang dipakai hanya melepas relasi m-n implisit (Prisma disconnect), tidak menghapus Project/Post"]
  - id: ENT-04
    name: "Skill"
    table: "Skill"
    serves: [F-01.2, F-06.4, US-014, US-019]
    fields:
      - { name: id,   type: id,   required: true, note: "cuid()" }
      - { name: name, type: teks, required: true, note: "unik — AC-014-1" }
      - { name: slug, type: teks, required: true, note: "unik; auto dari name; disiapkan, belum ada route yang memakainya" }
      - { name: icon, type: teks, required: false, note: "nama ikon tech-stack; divalidasi wajib di Zod (AC-014-1), bukan NOT NULL skema" }
    relations: ["m-n implisit ke Project (ENT-01)"]
    rules: ["CRUD penuh lewat SCR-14 (tambah/ubah/hapus, selalu konfirmasi sebelum hapus — AC-014-2)", "Dibaca publik lewat EP-17 (v2.3, D-016) — bagian Keahlian di Home (SCR-01) tampil ke pengunjung, terpisah dari EP-11 yang khusus admin"]
  - id: ENT-05
    name: "Media"
    table: "Media"
    serves: ["F-06.9, US-022 — infrastruktur unggahan & galeri (Kebutuhan Aset uiux_03_design_system.md)"]
    fields:
      - { name: id,        type: id,   required: true, note: "cuid()" }
      - { name: fileName,  type: teks, required: true, note: "" }
      - { name: objectKey, type: teks, required: true, note: "unik" }
      - { name: url,       type: teks, required: true, note: "" }
      - { name: mimeType,  type: teks, required: true, note: "" }
      - { name: extension, type: teks, required: true, note: "" }
      - { name: size,      type: angka, required: true, note: "bytes" }
    relations: ["tidak ada — katalog metadata, bukan FK dari Project/Post (D-011)"]
    rules: ["satu baris dibuat tiap kali admin mengunggah file — lewat halaman Media (SCR-18, EP-15/SA-19) atau inline form Project/Tulisan (G-016 BA); path hasil disalin ke field thumbnailImage terkait bila inline",
            "menghapus baris Media (SA-20) TIDAK mengosongkan thumbnailImage yang sudah tersalin ke Project/Post lain (tanpa FK, G-017 BA — risiko diterima)",
            "batas ukuran & jenis: gambar (jpg/png/webp) ≤ 2MB (G-003)"]
  - id: ENT-06
    name: "Pesan"
    table: "Message"
    serves: [F-05.2, F-06.7, US-008, US-018]
    fields:
      - { name: id,      type: id,   required: true, note: "cuid()" }
      - { name: name,    type: teks, required: true, note: "AC-008-1, AC-018-1" }
      - { name: email,   type: teks, required: true, note: "AC-008-1, AC-018-1" }
      - { name: message, type: teks-panjang, required: true, note: "AC-008-1, AC-018-1" }
      - { name: status,  type: "enum(MessageStatus)", required: true, note: "UNREAD default — pm_01 D008" }
    relations: []
    rules: ["hanya dibuat (publik, selalu UNREAD) dan dibaca/diarsipkan (admin) — tanpa story ubah isi/hapus (Scope Validation)",
            "transisi: UNREAD→READ otomatis saat dibuka (AC-018-3); UNREAD|READ→ARCHIVED saat Arsipkan (AC-018-4); ARCHIVED→READ saat Kembalikan",
            "urut tampil terbaru dulu berdasar createdAt (AC-018-1), disaring tab Aktif (UNREAD+READ) / Arsip (ARCHIVED)"]
  - id: ENT-07
    name: "Info Kontak"
    table: "ContactInfo"
    serves: [F-05.1, F-06.5, US-007, US-015]
    fields:
      - { name: id,    type: id,   required: true, note: "cuid()" }
      - { name: label, type: teks, required: true, note: "nama saluran — AC-007-1" }
      - { name: value, type: teks, required: true, note: "alamat/tautan saluran — AC-007-1" }
      - { name: icon,  type: teks, required: false, note: "" }
    relations: []
    rules: ["tabel flat multi-baris (D-013, mencabut desain singleton v1.0) — email pun baris biasa, tanpa field khusus",
            "CRUD penuh per baris lewat SCR-15 (BarisKelola) — menggantikan pola replace-all v1.0"]
  - id: ENT-08
    name: "User"
    table: "User"
    serves: [F-06.1, F-06.6, US-009, US-016]
    fields:
      - { name: id,           type: id,   required: true, note: "cuid()" }
      - { name: username,     type: teks, required: true, note: "unik — data masuk (AC-009-1)" }
      - { name: passwordHash, type: teks, required: true, note: "hash Bcrypt (TEAM_STACK.md)" }
    relations: []
    rules: ["tepat satu akun, disiapkan saat Data Awal — tanpa registrasi publik (Assumption BA A-005)",
            "murni kredensial login — TIDAK menyimpan data identitas pemilik (statis di kode, pm_01 D007); beda dari Admin v1.0 hanya soal nama tabel",
            "admin dapat mengganti passwordHash sendiri lewat SCR-19 (SA-21 changePassword) — wajib verifikasi kata sandi lama cocok dulu (G-018 BA, AC-023-1/2)",
            "TIDAK ada createdAt/updatedAt — D-009"]

