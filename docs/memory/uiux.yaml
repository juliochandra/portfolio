user_flows:
  - { id: FLOW-01, story: US-001, actor: "HRD / recruiter perusahaan", screens: [SCR-01], covers: [AC-001-1, AC-001-2, AC-001-3, AC-001-4],
      steps: ["1. Membuka website — nama & profesi pemilik langsung terlihat; menu ke About/Portfolio/Blog/Contact tersedia [AC-001-1]",
              "2. Dari ponsel: seluruh isi terbaca tanpa geser samping/zoom [AC-001-2]; seluruh teks berbahasa Indonesia [AC-001-3]",
              "CATATAN [AC-001-4]: 'muncul di pencarian Google' ditutup di sisi sistem — diteruskan ke Tech Lead (Skenario 5), bukan elemen layar"] }
  - { id: FLOW-02, story: US-019, actor: "HRD / recruiter perusahaan", screens: [SCR-01, SCR-03, SCR-04, SCR-05, SCR-06, SCR-07], covers: [AC-019-1, AC-019-2, AC-019-3],
      steps: ["1. Menggulir Home: ringkasan keahlian → cuplikan project unggulan → tulisan terbaru [AC-019-1]. Keahlian tampil utuh langsung di sini, tanpa halaman lengkap terpisah (v1.8 D-015 — perbaikan bug, sebelumnya keliru menyebut jalan ke About)",
              "2. Project Unggulan & Tulisan Terbaru masing-masing punya 'Lihat semua →' menuju halaman lengkapnya (Portfolio/Blog); tiap kartu/item juga bisa ditekan langsung menuju detailnya",
              "3. Bagian akhir: ajakan menghubungi (→ SCR-07) dan [Unduh CV] [AC-019-2]",
              "CABANG [AC-019-3]: belum ada project/tulisan → bagian sorotan itu disembunyikan; halaman tetap wajar (state kosong)"] }
  - { id: FLOW-03, story: US-002, actor: "HRD / recruiter perusahaan", screens: [SCR-02], covers: [AC-002-1],
      steps: ["1. Menu About → foto, profesi, dan perkenalan singkat pemilik tampil (About Hero) [AC-002-1]"] }
  - { id: FLOW-04, story: US-003, actor: "HRD / recruiter perusahaan", screens: [SCR-03], covers: [AC-003-1, AC-003-2],
      steps: ["1. Menu Portfolio → daftar project: nama + gambaran singkat [AC-003-1]",
              "CABANG [AC-003-2]: belum ada project → keterangan 'belum ada project' (state kosong)"] }
  - { id: FLOW-05, story: US-004, actor: "HRD / recruiter perusahaan", screens: [SCR-03, SCR-04], covers: [AC-004-1],
      steps: ["1. Menekan satu kartu project → Detail Project: deskripsi, peran pemilik, tautan bila ada [AC-004-1]",
              "2. '< Kembali ke Portfolio' memulangkan ke daftar"] }
  - { id: FLOW-06, story: US-005, actor: "HRD / recruiter perusahaan", screens: [SCR-05], covers: [AC-005-1, AC-005-2],
      steps: ["1. Menu Blog → daftar tulisan urut terbaru [AC-005-1]",
              "CABANG [AC-005-2]: belum ada tulisan → keterangan (state kosong)"] }
  - { id: FLOW-07, story: US-006, actor: "HRD / recruiter perusahaan", screens: [SCR-05, SCR-06], covers: [AC-006-1, AC-006-2],
      steps: ["1. Menekan satu item tulisan → isi tulisan utuh [AC-006-1]",
              "2. Tidak ada fitur komentar di mana pun [AC-006-2] — anotasi negatif di SCR-06"] }
  - { id: FLOW-08, story: US-007, actor: "HRD / recruiter perusahaan", screens: [SCR-07], covers: [AC-007-1],
      steps: ["1. Menu Contact → info kontak (yang dikelola admin) tampil [AC-007-1]"] }
  - { id: FLOW-09, story: US-008, actor: "HRD / recruiter perusahaan", screens: [SCR-07], covers: [AC-008-1, AC-008-2],
      steps: ["1. Mengisi formulir: nama, email, isi pesan (Assumption BA A-007)",
              "2. Menekan [Kirim Pesan] → penanda proses (state memuat)",
              "CABANG [AC-008-2]: isian wajib kosong → state error-validasi, bagian salah ditandai per isian → kembali ke 1",
              "3. [AC-008-1] State terkirim: tanda pesan terkirim; pesan muncul di Kotak Pesan admin (SCR-16, FLOW-18)"] }
  - { id: FLOW-10, story: US-009, actor: "Admin (pemilik website)", screens: [SCR-08, SCR-09], covers: [AC-009-1, AC-009-2, AC-009-3],
      steps: ["1. Membuka alamat halaman admin tanpa sesi → dialihkan ke Masuk Admin (SCR-08) [AC-009-3]",
              "2. Mengisi data masuk, menekan [Masuk]",
              "CABANG [AC-009-2]: data salah → state gagal-masuk, pemberitahuan jelas tanpa merinci bagian mana yang salah → kembali ke 2",
              "3. [AC-009-1] Berhasil → Dashboard (SCR-09), menu kelola tersedia"] }
  - { id: FLOW-11, story: US-010, actor: "Admin (pemilik website)", screens: [SCR-09, SCR-10, SCR-11, SCR-03], covers: [AC-010-1, AC-010-2],
      steps: ["1. Menu Project (SCR-10) → [+ Tambah Project] → Form Project (SCR-11)",
              "2. Mengisi isian, memilih status (default Draf), menekan [Simpan]",
              "CABANG [AC-010-2]: bagian wajib kosong → state error-validasi per isian → kembali ke 2",
              "3. [AC-010-1] Tersimpan → kembali ke SCR-10 dengan pesan berhasil; bila status Terbit, project tampil di Portfolio publik (SCR-03); bila Draf, belum tampil publik"] }
  - { id: FLOW-12, story: US-011, actor: "Admin (pemilik website)", screens: [SCR-10, SCR-11], covers: [AC-011-1, AC-011-2, AC-011-3, AC-011-4],
      steps: ["1. Di Kelola Project, memilih 'Ubah' pada satu baris → Form Project terisi data lama",
              "2. [AC-011-1] Menyimpan → versi terbaru tampil di publik bila status Terbit",
              "CABANG [AC-011-3]: status Draf → Terbit lalu simpan → project mulai tampil di Portfolio publik",
              "CABANG [AC-011-4]: status Terbit → Arsip lalu simpan → project hilang dari Portfolio publik, tetap ada di Kelola Project",
              "3. Memilih 'Hapus' → dialog konfirmasi (state konfirmasi-hapus)",
              "CABANG [AC-011-2]: batal → tidak terjadi apa-apa; konfirmasi → project hilang permanen dari publik + Kelola Project + pesan berhasil"] }
  - { id: FLOW-13, story: US-012, actor: "Admin (pemilik website)", screens: [SCR-12, SCR-13, SCR-05], covers: [AC-012-1, AC-012-2],
      steps: ["1. Menu Tulisan (SCR-12) → [+ Tulis Tulisan] → Form Tulisan (SCR-13)",
              "2. Mengisi judul, isi, gambar sampul & tag (opsional), memilih status (default Draf), menekan [Simpan]",
              "CABANG [AC-012-2]: judul kosong → state error-validasi → kembali ke 2",
              "3. [AC-012-1] Tersimpan → bila status Terbit, tulisan langsung tampil teratas di Blog publik (SCR-05); bila Draf, tersimpan tanpa tampil publik (menggantikan asumsi lama 'tanpa draf' — Assumption BA A-006 direvisi)"] }
  - { id: FLOW-14, story: US-013, actor: "Admin (pemilik website)", screens: [SCR-12, SCR-13], covers: [AC-013-1, AC-013-2, AC-013-3, AC-013-4],
      steps: ["1. 'Ubah' pada satu tulisan → form terisi data lama → simpan → versi terbaru tampil di publik bila status Terbit [AC-013-1]",
              "CABANG [AC-013-3]: status Draf → Terbit lalu simpan → tulisan mulai tampil di Blog publik",
              "CABANG [AC-013-4]: status Terbit → Arsip lalu simpan → tulisan hilang dari Blog publik, tetap ada di Kelola Tulisan",
              "2. 'Hapus' → dialog konfirmasi → konfirmasi → tulisan hilang permanen dari publik + Kelola Tulisan [AC-013-2]; batal → kembali tanpa perubahan"] }
  - { id: FLOW-15, story: US-014, actor: "Admin (pemilik website)", screens: [SCR-14, SCR-01], covers: [AC-014-1, AC-014-2],
      steps: ["1. Menu Keahlian → isi nama+ikon di Form Tambah → [+ Tambah]",
              "2. [AC-014-1] Tersimpan → keahlian baru masuk daftar; ringkasan Home menampilkan versi terbaru",
              "3. 'Ubah' pada satu baris → form terisi data lama → simpan → Home menampilkan versi terbaru",
              "CABANG [AC-014-2]: 'Hapus' → dialog konfirmasi → [Hapus] → keahlian hilang dari Home; [Batal] → tanpa perubahan",
              "CATATAN: data identitas pemilik (foto, perkenalan, Engineering Principles, dst., CV) statis di kode — tidak ada flow admin untuk itu (pm_01 D007)"] }
  - { id: FLOW-16, story: US-015, actor: "Admin (pemilik website)", screens: [SCR-15, SCR-07], covers: [AC-015-1],
      steps: ["1. Menu Contact Info → mengisi label+nilai+ikon di Form Tambah Saluran → [+ Tambah]",
              "2. [AC-015-1] Tersimpan → saluran baru masuk daftar; Contact publik menampilkan versi terbaru",
              "3. 'Ubah' pada satu baris → form terisi data lama → simpan → Contact publik menampilkan versi terbaru",
              "4. 'Hapus' → dialog konfirmasi → [Hapus] → saluran hilang dari Contact publik; [Batal] → tanpa perubahan"],
      notes: "Dirombak dari form singleton replace-all jadi CRUD per baris (pola FLOW-15), mengikuti skema ContactInfo flat multi-baris (techlead_02 D-013)" }
  - { id: FLOW-17, story: US-016, actor: "Admin (pemilik website)", screens: [SCR-09, SCR-08], covers: [AC-016-1],
      steps: ["1. Menekan 'Keluar' di kerangka halaman admin (tersedia di semua layar kelola)",
              "2. [AC-016-1] Sesi berakhir → kembali ke Masuk Admin; membuka alamat admin lagi → dialihkan ke SCR-08"] }
  - { id: FLOW-18, story: US-018, actor: "Admin (pemilik website)", screens: [SCR-16], covers: [AC-018-1, AC-018-2, AC-018-3, AC-018-4],
      steps: ["1. Menu Pesan → tab Aktif default → daftar pesan urut terbaru: penanda belum-dibaca, nama, email pengirim, isi [AC-018-1]",
              "CABANG [AC-018-2]: belum ada pesan di tab aktif → keterangan 'belum ada pesan' (state kosong)",
              "2. [AC-018-3] Membuka/melihat kartu pesan → status otomatis jadi sudah dibaca",
              "3. [AC-018-4] [Arsipkan] → pesan pindah ke tab Arsip tanpa terhapus; [Kembalikan] dari tab Arsip → kembali ke tab Aktif"] }
  - { id: FLOW-19, story: US-017, actor: "HRD / recruiter perusahaan", screens: [SCR-01], covers: [AC-017-1],
      steps: ["1. Menekan [Unduh CV] (hero Home & bagian ajakan — D-006) → berkas CV terunduh dan dapat dibuka [AC-017-1]"] }
  - { id: FLOW-20, story: US-020, actor: "HRD / recruiter perusahaan", screens: [SCR-02], covers: [AC-020-1, AC-020-2, AC-020-3, AC-020-4],
      steps: ["1. Menggulir halaman About → Engineering Principles, Development Workflow, Current Focus, dan Beyond Code tampil berurutan [AC-020-1, AC-020-2, AC-020-3, AC-020-4]"] }
  - { id: FLOW-21, story: US-021, actor: "Admin (pemilik website)", screens: [SCR-17], covers: [AC-021-1, AC-021-2],
      steps: ["1. Menu Tags → isi nama di Form Tambah Tag → [+ Tambah]",
              "2. [AC-021-1] Tersimpan → tag baru masuk daftar, tersedia dipilih di Form Project/Tulisan",
              "3. 'Ubah' pada satu baris → form terisi data lama → simpan",
              "CABANG [AC-021-2]: 'Hapus' → dialog konfirmasi → [Hapus] → tag hilang dari daftar (Project/Tulisan pemakainya tidak ikut terhapus); [Batal] → tanpa perubahan"] }
  - { id: FLOW-22, story: US-022, actor: "Admin (pemilik website)", screens: [SCR-18], covers: [AC-022-1, AC-022-2, AC-022-3],
      steps: ["1. Menu Media → [+ Unggah Gambar] → pilih file",
              "2. [AC-022-1] Terunggah → gambar masuk galeri",
              "3. [AC-022-2] Membuka halaman Media → seluruh gambar tampil urut terbaru; CABANG belum ada gambar → state kosong",
              "4. CABANG [AC-022-3]: 'Hapus' pada satu gambar → dialog konfirmasi → [Hapus] → gambar hilang dari galeri (tautan di Project/Tulisan pemakai tidak otomatis kosong); [Batal] → tanpa perubahan"] }
  - { id: FLOW-23, story: US-023, actor: "Admin (pemilik website)", screens: [SCR-19], covers: [AC-023-1, AC-023-2],
      steps: ["1. Menu Password → isi kata sandi lama, baru, konfirmasi → [Simpan]",
              "CABANG [AC-023-2]: kata sandi lama salah atau konfirmasi tidak cocok → state error-validasi → kembali ke 1",
              "2. [AC-023-1] Kata sandi berhasil diganti → pesan berhasil"] }

wireframes:
  - { screen: SCR-01, status: done, sections: [Navbar, Hero, Keahlian, Project Unggulan, Tulisan Terbaru, Ajakan, Footer],
      key_elements: [MenuUtama, SaklarTema, TombolUtama, TagKeahlian, KartuProject, ItemTulisan],
      states_done: [normal, kosong], notes: "Urutan section = urutan sebutan client (pm_01 D005); sorotan kosong (Terbit) disembunyikan (AC-019-3); Tulisan Terbaru = list 1 kolom penuh lebar (gaya medium.com, D-008), thumbnail kanan opsional (D-013), beda dari Project Unggulan yang tetap grid 3 kolom di layar lebar" }
  - { screen: SCR-02, status: done, sections: [Navbar, About Hero, Engineering Principles, Development Workflow, Current Focus, Beyond Code, Footer],
      key_elements: [MenuUtama, SeksiTeks], states_done: [normal], notes: "Keahlian dipindah eksklusif ke Home (pm_01 D006); empat section + About Hero = teks statis di KODE, bukan dikelola admin sama sekali (direvisi pm_01 D007, G-009/A-008 BA, D-012)" }
  - { screen: SCR-03, status: done, sections: [Navbar, Portfolio Hero, Daftar Project, Footer],
      key_elements: [MenuUtama, KartuProject], states_done: [normal, kosong], notes: "Portfolio Hero: judul + tagline satu kalimat, teks statis (sama untuk semua pengunjung, tidak dikelola admin — D-010, klarifikasi user 2026-07-16: seluruh section hero di semua halaman statis untuk saat ini). Daftar Project hanya berstatus Terbit (D-013)" }
  - { screen: SCR-04, status: done, sections: [Navbar, Header Project, Isi Project, Footer],
      key_elements: [NavKembali, TagKeahlian, TombolUtama], states_done: [normal], notes: "Tautan demo/kode hanya tampil bila ada (AC-004-1)" }
  - { screen: SCR-05, status: done, sections: [Navbar, Blog Hero, Daftar Tulisan, Footer],
      key_elements: [MenuUtama, ItemTulisan], states_done: [normal, kosong], notes: "Hanya tulisan berstatus Terbit, urut terbaru (Assumption BA A-002); list 1 kolom di semua lebar layar (tanpa grid), konsisten gaya medium.com (D-008), thumbnail kanan opsional (D-013) — beda dari SCR-03 Portfolio yang 2-3 kolom; Blog Hero: judul + tagline statis (D-011, pola sama D-010)" }
  - { screen: SCR-06, status: done, sections: [Navbar, Header Tulisan, Isi Tulisan, Footer],
      key_elements: [NavKembali], states_done: [normal], notes: "Tanpa area komentar — anotasi negatif (AC-006-2)" }
  - { screen: SCR-07, status: done, sections: [Navbar, Contact Hero, Info Kontak, Formulir Pesan, Footer],
      key_elements: [MenuUtama, TautanKontak, FormIsian, TombolUtama, PesanStatus],
      states_done: [normal, error-validasi, memuat, terkirim], notes: "Contact Hero: judul + tagline statis (D-011); Info Kontak tetap section terpisah setelahnya, tidak melebur (klarifikasi user)" }
  - { screen: SCR-08, status: done, sections: [Form Masuk],
      key_elements: [FormIsian, TombolUtama, PesanStatus], states_done: [normal, gagal-masuk], notes: "Pesan gagal tidak merinci bagian mana yang salah (AC-009-2)" }
  - { screen: SCR-09, status: done, sections: [Header Admin, Ringkasan Statistik, Aktivitas Terbaru, Pintasan Cepat],
      key_elements: [MenuAdmin, SaklarTema, KartuStatistik, BarisRingkasan, PintasanAksi],
      states_done: [normal, terlarang], notes: "Dirombak dari 'Beranda Halaman Admin' (daftar pintasan kosong) jadi 'Dashboard' beranalitik — kartu statistik + aktivitas terbaru + pintasan cepat, murni pemanis tampilan non-blocking (pm_01 D009, G-009). Kerangka header+menu dipakai semua layar kelola; 'Keluar' selalu terlihat (US-016)" }
  - { screen: SCR-10, status: done, sections: [Header Admin, Daftar Kelola Project],
