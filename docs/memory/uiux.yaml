  - { screen: SCR-12, status: done, sections: [Header Admin, Daftar Kelola Tulisan],
      key_elements: [MenuAdmin, BarisKelola, TombolUtama, DialogKonfirmasi, PesanStatus],
      states_done: [normal, kosong, konfirmasi-hapus, terlarang], notes: "Judul layar 'Posts' (label Inggris, D-009); baris menampilkan badge status Draft/Published/Archived (D-014)" }
  - { screen: SCR-13, status: done, sections: [Header Admin, Form Tulisan],
      key_elements: [MenuAdmin, FormIsian, PilihanStatus, TombolUtama, NavKembali],
      states_done: [normal, error-validasi, terlarang], notes: "Isian: judul*, isi*, gambar sampul (pilih dari galeri Media atau unggah baru, thumbnail & share), tag (pilih dari daftar Tag, direvisi dari input bebas), status Draft/Published/Archived (default Draft) — menggantikan 'langsung tayang saat disimpan', A-006 BA direvisi (D-014)" }
