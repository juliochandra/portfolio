      states_done: [normal, kosong, konfirmasi-hapus, terlarang], notes: "Judul layar 'Projects' (label Inggris, D-009); baris menampilkan badge status Draft/Published/Archived (label Inggris, D-014)" }
  - { screen: SCR-11, status: done, sections: [Header Admin, Form Project],
