gap_list:
  - { id: G-001, question: "Label menu memakai bahasa apa? (konten wajib Indonesia, tapi client menamai halaman HOME/ABOUT/PORTFOLIO/BLOG/CONTACT)",
      blocking: false, resolution: "Nama halaman diperlakukan sebagai nama diri dari client (Q&A pm) → label menu Home·About·Portfolio·Blog·Contact; seluruh teks lain berbahasa Indonesia di SISI PUBLIK. DIREVISI 2026-07-16 (G-008): sisi admin boleh bahasa campuran", status: resolved }
  - { id: G-002, question: "'Project unggulan' di Home ditentukan bagaimana? (BA tidak mendefinisikan 'unggulan')",
      blocking: false, resolution: "Default tanpa kemampuan baru: cuplikan = project terbaru; kurasi manual 'tandai unggulan' = kemampuan baru → usulan di Open Questions", status: resolved }
  - { id: G-003, question: "Jumlah cuplikan di Home?", blocking: false,
      resolution: "3 project + 3 tulisan terbaru — cukup memberi gambaran tanpa memperpanjang halaman", status: resolved }
  - { id: G-004, question: "Bentuk konfirmasi hapus: dialog atau halaman?", blocking: false,
      resolution: "Dialog — perilaku 'selalu konfirmasi' sudah dari AC; bentuk dialog paling ringkas", status: resolved }
  - { id: G-005, question: "Membaca pesan: layar detail terpisah atau langsung di daftar?", blocking: false,
      resolution: "Langsung di daftar (kartu memuat isi utuh) — AC-018-1 menuntut nama+email+isi terlihat; volume pesan portfolio kecil", status: resolved }
  - { id: G-006, question: "Bagaimana wujud UI pemilihan status Draf/Terbit/Arsip di form Project/Tulisan?", blocking: false,
      resolution: "Satu isian dropdown/radio (PilihanStatus, C-16) di form yang sama, bukan tombol simpan terpisah — konsisten pola form tunggal SCR-11/SCR-13", status: resolved }
  - { id: G-007, question: "Bagaimana wujud UI arsip pesan di Kotak Pesan?", blocking: false,
      resolution: "Dua tab (TabSwitch, C-17) Aktif/Arsip; tab Aktif default terbuka — sederhana untuk admin non-teknis, konsisten pola minim-klik. Label tab DIREVISI 2026-07-16 jadi Active/Archived (G-008)", status: resolved }
  - { id: G-008, question: "Client memberi referensi desain admin (docs/ui/cms/) berlabel Inggris — bahasa apa yang dipakai sisi admin?", blocking: false,
      resolution: "Bahasa campuran: label navigasi/modul/status Inggris (Dashboard, Posts, Projects, Tags, Skills, Media, Messages, Contact Info, Password, Draft/Published/Archived, Active/Archived); sisa teks kelola (isian form, tombol, pesan, dialog) tetap Bahasa Indonesia. Perbaikan kesalahan framework uiux-agent lama yang menyamakan bahasa seluruh UI dengan bahasa konten publik (pm_01 D009)", status: resolved }
  - { id: G-009, question: "Apakah Dashboard (SCR-09) perlu AC/US tersendiri untuk kartu statistik & aktivitas terbaru?", blocking: false,
      resolution: "Tidak — murni pemanis tampilan (kesan profesional, tidak kosong), non-blocking, tanpa AC baru (klarifikasi user 2026-07-16)", status: resolved }
  - { id: G-010, question: "Isian Tag di Form Project/Tulisan — tetap input bebas, atau ikut jadi pilih-dari-daftar sekarang Tag punya halaman kelola sendiri?", blocking: false,
      resolution: "Pilih-dari-daftar (multi-select), konsisten dengan Tag yang kini terkelola — direvisi dari input bebas lama (G-014 BA)", status: resolved }
  - { id: G-011, question: "Unggah gambar — cuma lewat halaman Media baru, atau tetap bisa inline dari form Project/Tulisan?", blocking: false,
      resolution: "Dua jalur, masuk katalog Media yang sama — halaman Media untuk unggah mandiri/kelola galeri, inline form untuk kenyamanan saat mengisi Project/Tulisan (G-016 BA)", status: resolved }
  - { id: G-012, question: "Bagaimana wujud UI verifikasi kata sandi lama di SCR-19?", blocking: false,
      resolution: "Field terpisah 'Kata sandi lama' di atas 'Kata sandi baru'+konfirmasi, satu form, satu tombol Simpan — pola sama form lain, bukan wizard multi-langkah (G-018 BA)", status: resolved }

assumption_list:
  - { id: A-001, assumption: "Label menu memakai nama halaman dari client (Home·About·Portfolio·Blog·Contact); seluruh teks lain berbahasa Indonesia", gap: G-001, status: documented }
  - { id: A-002, assumption: "Cuplikan Home = 3 project terbaru + 3 tulisan terbaru; sorotan yang datanya kosong disembunyikan", gap: G-002, status: documented }
  - { id: A-003, assumption: "Jumlah cuplikan per sorotan: 3", gap: G-003, status: documented }
  - { id: A-004, assumption: "Konfirmasi hapus berbentuk dialog dengan aksi danger", gap: G-004, status: documented }
  - { id: A-005, assumption: "Pesan dibaca langsung di daftar Kotak Pesan (tanpa layar detail)", gap: G-005, status: documented }
  - { id: A-006, assumption: "Status Draf/Terbit/Arsip dipilih lewat satu isian dropdown/radio (PilihanStatus, C-16), bukan tombol simpan terpisah", gap: G-006, status: documented }
  - { id: A-007, assumption: "Pesan diarsipkan lewat dua tab terpisah (Active/Archived, TabSwitch C-17), bukan filter/dropdown", gap: G-007, status: documented }
  - { id: A-008, assumption: "Sisi admin bahasa campuran — label navigasi/modul/status Inggris, sisa teks kelola Bahasa Indonesia", gap: G-008, status: documented }
  - { id: A-009, assumption: "Dashboard (SCR-09) murni pemanis tampilan, non-blocking, tanpa AC tersendiri", gap: G-009, status: documented }
  - { id: A-010, assumption: "Isian Tag di Form Project/Tulisan jadi pilih-dari-daftar (multi-select), bukan input bebas lagi", gap: G-010, status: documented }
  - { id: A-011, assumption: "Unggah gambar dua jalur (halaman Media atau inline form Project/Tulisan), masuk katalog Media yang sama", gap: G-011, status: documented }
  - { id: A-012, assumption: "Ubah kata sandi: field kata sandi lama terpisah di atas kata sandi baru+konfirmasi, satu form satu tombol Simpan", gap: G-012, status: documented }

decision_log:
  - { id: D-001, decision: "Multi-halaman (7 layar publik), bukan single-page", reason: "Client menamai 5 halaman eksplisit di pm_01_project.md; Blog & Portfolio berkonten dinamis butuh halaman daftar+detail", time: "2026-07-15" }
  - { id: D-002, decision: "Token warna memakai nilai asli Primer (design system GitHub), dua set terang/gelap", reason: "Preferensi Visual = referensi konkret github.com → wajib nilai asli (07 §6.1 aturan 2); sumber: primer.style/primitives", time: "2026-07-15" }
  - { id: D-003, decision: "SaklarTema (C-03) hadir di navbar publik & header admin", reason: "Preferensi Visual 'tersedia mode terang dan gelap' = kapabilitas → wajib komponen + elemen nyata (07 §6.1 aturan 3)", time: "2026-07-15" }
  - { id: D-004, decision: "AC-001-4 (muncul di Google) dipilah sebagai AC operasional/sistem — catatan handoff ke Tech Lead", reason: "Tidak ada wujud layar; Skenario 5 (09_FAILURE_HANDLING)", time: "2026-07-15" }
  - { id: D-005, decision: "Kerangka admin (header + menu) = satu pola dipakai 8 layar kelola", reason: "Konsistensi; 'Keluar' selalu terlihat memenuhi US-016", time: "2026-07-15" }
  - { id: D-006, decision: "[Unduh CV] muncul di hero dan bagian Ajakan Home", reason: "US-017 aktor recruiter — aksi kunci terlihat tanpa mencari; ajakan CTA dari pm_01 D005", time: "2026-07-15" }
  - { id: D-007, decision: "Urutan section Home: Hero → Keahlian → Project Unggulan → Tulisan Terbaru → Ajakan", reason: "Mengikuti urutan sebutan client (pm_01_project.md D005)", time: "2026-07-15" }
  - { id: D-008, decision: "Tulisan Terbaru (Home) & Daftar Tulisan (SCR-05) pakai gaya list ala medium.com (C-05 → ItemTulisan), bukan grid kartu; urutan CTA Ajakan (Hubungi Saya lalu Unduh CV, D-006/D-007) dikonfirmasi ulang tetap, tidak berubah", reason: "Revisi pasca-handoff — client memberi referensi visual eksplisit untuk Blog; scope tampilan/urutan = non-blocking (ba-agent/08_GAP_HANDLING.md §3), tidak menyentuh pm_01/BA/Tech Lead", time: "2026-07-16" }
  - { id: D-009, decision: "SCR-02 About dirombak: About Hero + 4 section baru (Engineering Principles, Development Workflow, Current Focus, Beyond Code — komponen baru C-15 SeksiTeks); Keahlian dihapus dari About (eksklusif di Home); SCR-14 Form Profil diperluas 4 isian baru, keahlian tetap ada di form meski tak tampil di About", reason: "Mengikuti set BA v3.0 (F-02.1 direvisi + F-02.2..F-02.5 baru, D-007 BA) yang mengikuti pm_01_project.md v1.3 (D006) — perubahan scope/requirement, bukan sekadar tampilan; blok isi ditetapkan BA, tata letak & komponen ini keputusan UI/UX", time: "2026-07-16" }
  - { id: D-010, decision: "SCR-03 Portfolio dapat section baru Portfolio Hero (judul + tagline satu kalimat) sebelum Daftar Project; tagline = teks statis, tidak dikelola admin. Berlaku sebagai prinsip umum: seluruh section hero di semua halaman (Home/About/Portfolio/dst.) statis untuk saat ini, bukan data admin-managed", reason: "Klarifikasi eksplisit client — pilihan teks/tampilan = non-blocking (ba-agent/08_GAP_HANDLING.md §3), tidak perlu field database baru atau siklus PM/BA; cukup UI/UX menuliskan copy-nya", time: "2026-07-16" }
  - { id: D-011, decision: "SCR-05 Blog dapat Blog Hero (judul + tagline statis, pola sama D-010); SCR-07 Contact dapat Contact Hero (judul + tagline statis) sebelum Info Kontak — Info Kontak TETAP section terpisah, tidak melebur ke hero (klarifikasi eksplisit user)", reason: "Konsisten dengan prinsip hero statis (D-010); Info Kontak tetap wajib section sendiri karena AC-007-1 sudah menuntut data itu tampil — bukan sekadar keputusan tampilan", time: "2026-07-16" }
