  - { asset: "Teks perkenalan (About Hero, bahasa Indonesia)",   from: "pemilik (statis, developer tempel ke kode — D007)", for: [SCR-01, SCR-02] }
  - { asset: "Teks Engineering Principles, Development Workflow, Current Focus, Beyond Code (bahasa Indonesia)", from: "pemilik (statis, developer tempel ke kode — D007)", for: [SCR-02] }
  - { asset: "Daftar keahlian (nama + ikon)",                    from: "pemilik (dikelola via SCR-14)", for: [SCR-01, SCR-14] }
