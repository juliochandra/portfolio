design_tokens:
  colors:  # sumber: Primer (design system GitHub) — primer.style/primitives; dicatat di D-002
    - { role: canvas,       usage: "latar halaman",                        value: "terang #ffffff · gelap #0d1117" }
    - { role: surface,      usage: "latar kartu/panel/section selang",     value: "terang #f6f8fa · gelap #161b22" }
    - { role: text,         usage: "teks utama",                           value: "terang #1f2328 · gelap #e6edf3" }
    - { role: text-mute,    usage: "meta: tanggal, peran, keterangan",     value: "terang #59636e · gelap #8b949e" }
    - { role: border,       usage: "garis kartu, pemisah, bingkai isian",  value: "terang #d0d7de · gelap #30363d" }
    - { role: accent,       usage: "tautan, elemen interaktif, fokus",     value: "terang #0969da · gelap #58a6ff" }
    - { role: primary,      usage: "tombol aksi utama (Kirim, Simpan, Unduh CV)", value: "terang #1f883d · gelap #238636 (hijau tombol GitHub)" }
    - { role: danger,       usage: "error & aksi hapus",                   value: "terang #cf222e · gelap #f85149" }
  typography:
    - { role: heading, spec: "tegas; nama pemilik di hero = terbesar; maksimal 3 tingkat hierarki" }
    - { role: body,    spec: "nyaman dibaca di HP; baris ≤ ±70 karakter; tulisan blog = prioritas keterbacaan" }
  spacing: "basis 8 (8/16/24/32); antar section 2× jarak internal — batas section terasa tanpa garis tebal"

components:
  - { id: C-01, name: "TombolUtama",     anatomy: "label aksi; varian: primer (hijau), sekunder (garis tepi), bahaya (danger)",
      behavior: "satu aksi utama per area; saat proses berjalan menunjukkan penanda sibuk", used_in: [SCR-01, SCR-04, SCR-07, SCR-08, SCR-10, SCR-11, SCR-12, SCR-13, SCR-14, SCR-15] }
  - { id: C-02, name: "MenuUtama",       anatomy: "nama pemilik (kiri) + tautan Home·About·Portfolio·Blog·Contact + SaklarTema (kanan)",
      behavior: "layar sempit: tautan terlipat ke ≡; halaman aktif ditandai", used_in: [SCR-01, SCR-02, SCR-03, SCR-04, SCR-05, SCR-06, SCR-07] }
  - { id: C-03, name: "SaklarTema",      anatomy: "tombol ikon matahari/bulan",
      behavior: "mengganti mode terang ↔ gelap seketika; pilihan diingat selama kunjungan berikutnya; wujud kapabilitas 'tersedia mode terang & gelap' dari Preferensi Visual pm_01_project.md", used_in: [SCR-01, SCR-02, SCR-03, SCR-04, SCR-05, SCR-06, SCR-07, SCR-09] }
  - { id: C-04, name: "KartuProject",    anatomy: "nama + gambaran singkat 2 baris + tag keahlian (+ gambar bila ada)",
      behavior: "seluruh kartu bisa ditekan → SCR-04; layar lebar: 2–3 kolom", used_in: [SCR-01, SCR-03] }
  - { id: C-05, name: "ItemTulisan",    anatomy: "baris list (bukan kartu/kotak) — judul + tanggal + cuplikan awal isi 2 baris + thumbnail kanan (opsional), dipisah garis antar-item, tanpa bingkai/shadow",
      behavior: "seluruh baris bisa ditekan → SCR-06; urut terbaru; selalu 1 kolom penuh lebar (gaya medium.com, D-008/D-013)", used_in: [SCR-01, SCR-05] }
  - { id: C-06, name: "TagKeahlian",     anatomy: "label pendek berlatar surface",
      behavior: "statis, tidak bisa ditekan", used_in: [SCR-01, SCR-04] }  # v1.8: SCR-02 dihapus (About tak lagi menampilkan keahlian sejak D-009), leftover diperbaiki D-015
  - { id: C-07, name: "TautanKontak",    anatomy: "ikon + label saluran (email, tautan profesional lain — sesuai isian admin)",
      behavior: "email membuka aplikasi surel; tautan lain membuka tab baru", used_in: [SCR-07] }
  - { id: C-08, name: "FormIsian",       anatomy: "label + isian + tanda * untuk wajib + baris pesan error per isian",
      behavior: "error ditampilkan per bagian yang salah, bukan hanya di atas form", used_in: [SCR-07, SCR-08, SCR-11, SCR-13, SCR-14, SCR-15] }
  - { id: C-09, name: "NavKembali",      anatomy: "< + label tujuan",
      behavior: "kembali ke daftar/posisi sebelumnya", used_in: [SCR-04, SCR-06, SCR-11, SCR-13] }
  - { id: C-10, name: "MenuAdmin",       anatomy: "header: nama pemilik + 'CMS Dashboard' + SaklarTema + tombol Keluar; menu berkelompok, label Inggris (pm_01 D009): Overview (Dashboard) · Content (Posts, Projects, Tags, Skills, Media) · Communication (Messages, Contact Info) · System (Password)",
      behavior: "layar sempit: menu terlipat ke ≡; 'Keluar' selalu terlihat tanpa membuka menu (US-016); bagian aktif ditandai; label modul Inggris, sisa teks kelola tetap Indonesia (uiux-agent 07 aturan 6)", used_in: [SCR-09, SCR-10, SCR-11, SCR-12, SCR-13, SCR-14, SCR-15, SCR-16, SCR-17, SCR-18, SCR-19] }
  - { id: C-11, name: "BarisKelola",     anatomy: "nama/judul item + meta singkat + badge status (opsional, Draft/Published/Archived — label Inggris mengikuti enum) + aksi 'Ubah' & 'Hapus'",
      behavior: "Hapus selalu membuka DialogKonfirmasi; layar sempit: aksi tetap terlihat per baris", used_in: [SCR-10, SCR-12, SCR-14, SCR-15, SCR-17] }
  - { id: C-12, name: "DialogKonfirmasi", anatomy: "pertanyaan + nama item + [Batal] [Hapus]",
      behavior: "Hapus berwarna danger; Batal = aksi aman & default; menutup tanpa aksi bila ditutup", used_in: [SCR-10, SCR-12, SCR-14, SCR-15, SCR-17, SCR-18] }
  - { id: C-13, name: "PesanStatus",     anatomy: "bilah pesan singkat: berhasil / gagal / info",
      behavior: "muncul setelah aksi (tersimpan, terkirim, terhapus, gagal masuk, terunggah); hilang sendiri atau bisa ditutup", used_in: [SCR-07, SCR-08, SCR-10, SCR-12, SCR-14, SCR-15, SCR-17, SCR-18, SCR-19] }
  - { id: C-14, name: "KartuPesan",      anatomy: "penanda belum-dibaca (opsional) + nama pengirim + email + waktu + isi pesan utuh + aksi Arsipkan/Kembalikan",
      behavior: "urut terbaru di atas; email pengirim bisa ditekan (membuka aplikasi surel untuk membalas); buka/tampil kartu = tandai dibaca otomatis (AC-018-3); Arsipkan/Kembalikan pindah tab tanpa hapus (AC-018-4)", used_in: [SCR-16] }
  - { id: C-15, name: "SeksiTeks",       anatomy: "judul section (heading) + isi teks bebas (paragraf/daftar poin sederhana), statis di kode — bukan dikelola admin (pm_01 D007)",
      behavior: "statis, tidak bisa ditekan/interaktif", used_in: [SCR-02] }
  - { id: C-16, name: "PilihanStatus",   anatomy: "3 opsi radio/dropdown — Draft · Published · Archived (label Inggris, mengikuti enum PublishStatus — konsisten badge C-11)",
      behavior: "satu isian dalam form yang sama, bukan tombol simpan terpisah; status awal konten baru = Draft; hanya Published tampil publik", used_in: [SCR-11, SCR-13] }
  - { id: C-17, name: "TabSwitch",       anatomy: "dua pilihan sejajar — Active · Archived (label Inggris, D-009)",
      behavior: "menyaring daftar yang ditampilkan; tab Active = default terbuka", used_in: [SCR-16] }
  - { id: C-18, name: "KartuStatistik",  anatomy: "ikon + label metrik + angka besar + keterangan kecil (mis. 'Published: 11')",
      behavior: "statis, tidak bisa ditekan; angka hasil hitung otomatis — murni pemanis tampilan (pm_01 D009, non-blocking)", used_in: [SCR-09] }
  - { id: C-19, name: "BarisRingkasan",  anatomy: "thumbnail kecil + judul + tag/skill singkat + badge status + tanggal",
      behavior: "seluruh baris bisa ditekan → form ubah item itu; beda dari BarisKelola (C-11) karena tanpa aksi Ubah/Hapus eksplisit di baris", used_in: [SCR-09] }
  - { id: C-20, name: "KartuMedia",      anatomy: "gambar thumbnail + nama file + ukuran berkas + aksi [Hapus]",
      behavior: "grid responsif (2 kolom layar sempit, 4–6 kolom layar lebar); urut terbaru; [Hapus] → DialogKonfirmasi (C-12)", used_in: [SCR-18] }
  - { id: C-21, name: "PintasanAksi",    anatomy: "ikon + label aksi singkat + keterangan kecil",
      behavior: "menuju form tambah/halaman kelola terkait; murni navigasi cepat", used_in: [SCR-09] }

