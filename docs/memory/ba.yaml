gap_list:
  - id: G-001
    question: "Pesan dari formulir Contact: bagaimana pemilik menerimanya/membacanya? (masuk ke email pemilik? kotak masuk di halaman admin? keduanya?)"
    blocking: true
    resolution: "Dijawab pm_01_project.md v1.1 (D004): pesan masuk ke kotak pesan di halaman admin → F-06.7, US-018"
    status: resolved
  - id: G-002
    question: "Detail project berisi apa saja?"
    blocking: false
    resolution: "Tidak dirinci sumber → default sederhana: deskripsi, peran pemilik, tautan bila ada"
    status: resolved
  - id: G-003
    question: "Daftar tulisan blog: urutan & kategori?"
    blocking: false
    resolution: "Tidak disebut sumber → urut waktu terbaru, tanpa pengelompokan kategori pada tampilan daftar. DIREVISI (2026-07-16, keputusan skema database): tulisan dapat diberi tag/label (dipakai bersama Project) sebagai metadata siap-pakai untuk kebutuhan filter di masa depan — belum ada filter/pengelompokan aktif memakainya saat ini, tampilan daftar tetap kronologis tanpa kategori"
    status: resolved
  - id: G-004
    question: "Hapus project/tulisan: permanen atau bisa dikembalikan?"
    blocking: false
    resolution: "Default paling sederhana: permanen, dengan konfirmasi sebelum menghapus. DIREVISI (2026-07-16, pm_01 D008): kini ada opsi Arsip (status tayang) sebagai alternatif 'sembunyikan tanpa hapus' sebelum admin memutuskan hapus permanen — dua mekanisme terpisah, bukan saling menggantikan"
    status: resolved
  - id: G-005
    question: "Bagaimana berkas CV diperbarui?"
    blocking: false
    resolution: "DIREVISI (2026-07-16, pm_01 D007): CV bersifat statis, diperbarui developer saat deploy — bukan diganti admin. Resolusi awal (CV bagian pengelolaan profil) sudah tidak berlaku"
    status: resolved
  - id: G-006
    question: "Siapa menyiapkan akun admin pertama kali?"
    blocking: false
    resolution: "Konteks operasional: satu akun admin (pemilik), disiapkan saat penyiapan awal website"
    status: resolved
  - id: G-007
    question: "Apakah ada mekanisme draf sebelum terbit?"
    blocking: false
    resolution: "Sumber tidak menyebut draf → konten yang disimpan langsung tayang. DIREVISI (2026-07-16, pm_01 D008): Project & Tulisan kini punya status tayang Draf/Terbit/Arsip — admin butuh cara menyimpan konten belum selesai tanpa tampil publik; hanya status Terbit tampil di halaman publik"
    status: resolved
  - id: G-008
    question: "Formulir pesan berisi isian apa saja?"
    blocking: false
    resolution: "Default sederhana selaras tujuan 'menghubungi': nama, alamat email pengirim, isi pesan"
    status: resolved
  - id: G-009
    question: "Empat section About baru (Engineering Principles, Development Workflow, Current Focus, Beyond Code) — teks statis atau daftar item CRUD seperti Project/Tulisan?"
    blocking: false
    resolution: "DIREVISI (2026-07-16, pm_01 D007): teks statis di KODE, BUKAN dikelola admin sama sekali (bukan field database). Resolusi awal (dikelola admin sebagai bagian Profil) sudah tidak berlaku — seluruh data identitas pemilik (About Hero + 4 section ini) statis"
    status: resolved
  - id: G-010
    question: "Keahlian sekarang tabel `skill` tersendiri (bukan field Profile) — dikelola bagaimana oleh admin?"
    blocking: false
    resolution: "Default sederhana konsisten pola Project/Tulisan: tambah/ubah/hapus satu-satu (nama + ikon) — F-06.4 dirombak jadi 'Mengelola keahlian'"
    status: resolved
  - id: G-011
    question: "Bagaimana admin memicu perubahan status Draf/Terbit/Arsip pada Project/Tulisan?"
    blocking: false
    resolution: "Satu isian status di form yang sama (dropdown/radio Draf/Terbit/Arsip), bukan tombol simpan terpisah — konsisten dengan pola form tunggal yang sudah ada; status awal konten baru = Draf"
    status: resolved
  - id: G-012
    question: "Bagaimana admin tahu pesan mana yang belum dibaca, dan bagaimana merapikan kotak pesan?"
    blocking: false
    resolution: "Pesan otomatis tertandai dibaca saat admin membuka/melihatnya (tanpa aksi manual tandai-dibaca terpisah); pesan yang sudah ditindaklanjuti dapat diarsipkan admin secara manual agar kotak pesan tetap rapi, tanpa dihapus — dapat dikembalikan ke daftar utama kapan saja"
    status: resolved
  - id: G-013
    question: "'Peran saya' pada Project — field terstruktur terpisah, atau bagian deskripsi bebas?"
    blocking: false
    resolution: "Keputusan implementasi Tech Lead saat perancangan skema: digabung ke isian deskripsi bebas, bukan field terpisah — AC-004-1 tetap terpenuhi karena admin dapat menuliskan perannya di sana; tidak mengurangi info yang tampil ke pengunjung, hanya cara admin menuliskannya"
    status: resolved
  - id: G-014
    question: "Tag pada Project/Tulisan — dipilih dari daftar tersedia, ketik bebas, atau kombinasi? Perlu halaman kelola tag tersendiri?"
    blocking: false
    resolution: "Input bebas (tag terpisah koma/enter) di form Project/Tulisan; tag baru dibuat otomatis saat pertama dipakai, tag yang sudah ada dipakai ulang bila namanya cocok — tanpa halaman kelola tag terpisah, karena belum ada kebutuhan admin melihat/mengelola daftar tag secara mandiri; disiapkan untuk kebutuhan filter di masa depan. DIREVISI (2026-07-16, pm_01 D009): referensi desain admin client menunjukkan Tag punya halaman kelola tersendiri (pola sama Skill) — F-06.8 baru; isian Tag di form Project/Tulisan jadi pilih-dari-daftar, bukan ketik bebas lagi"
    status: resolved
  - id: G-015
    question: "Menghapus tag yang sedang dipakai Project/Tulisan — ikut menghapus Project/Tulisan, atau cuma melepas keterkaitan?"
    blocking: false
    resolution: "Cuma melepas keterkaitan — Project/Tulisan tetap ada, cuma kehilangan 1 tag itu (default non-blocking, konsisten prinsip 'jangan hapus data yang tidak diminta dihapus')"
    status: resolved
  - id: G-016
    question: "Unggah gambar — cuma inline dari form Project/Tulisan (v1.0-v1.6 lama), atau juga langsung dari halaman Media baru?"
    blocking: false
    resolution: "Dua jalur: langsung dari halaman Media, atau inline dari form Project/Tulisan — keduanya masuk galeri yang sama; admin bisa pilih gambar dari galeri atau unggah baru saat mengisi form Project/Tulisan"
    status: resolved
  - id: G-017
    question: "Menghapus media yang sedang dipakai sebagai gambar Project/Tulisan — apa yang terjadi ke rujukannya di sana?"
    blocking: false
    resolution: "TIDAK otomatis dikosongkan (tanpa relasi wajib ke Media, keputusan Tech Lead D-011) — admin bertanggung jawab tidak menghapus file yang masih dipakai; risiko diterima mengingat skala kecil, 1 admin"
    status: resolved
  - id: G-018
    question: "Ubah kata sandi — perlu verifikasi kata sandi lama, atau admin bisa langsung isi kata sandi baru?"
    blocking: false
    resolution: "Wajib verifikasi kata sandi lama yang benar dulu sebelum kata sandi baru disimpan — pola keamanan standar, mencegah orang lain yang kebetulan memegang sesi aktif mengganti kata sandi tanpa tahu kata sandi asli"
    status: resolved

