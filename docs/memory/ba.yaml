      reason: "pm_01_project.md v1.2 merinci isi Home (D005 PM) — semua sorotan komposisi fitur yang ada, bukan scope baru; blok isi ditetapkan BA, susunan/urutan tetap milik UI/UX; butir lain tidak terdampak — validasi dijalankan ulang seluruhnya",
