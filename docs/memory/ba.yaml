project:
  id: PRJ-001
  title: "Portfolio Developer"
  source: "docs/pm_01_project.md"
  source_version: "1.6"
  status: done   # set BA v6.0 (sumber v1.6, revisi D009: referensi desain admin client — Tag & Media dapat halaman kelola, ubah kata sandi, label admin boleh Inggris) diserahkan ke UI/UX & Tech Lead — BA berhenti

feature_breakdown:
  - id: F-01
    name: "Halaman Home"
    description: "Halaman pembuka: pengunjung langsung tahu siapa pemilik, melihat sorotan konten, dan dapat menuju bagian lain"
    priority: must
    source: "pm_01_project.md > Core Features > Halaman Home (v1.2)"
    sub:
      - { id: F-01.1, name: "Melihat halaman pembuka", description: "Identitas singkat pemilik (nama & profesi) tampil; tersedia jalan ke About, Portfolio, Blog, Contact" }
      - { id: F-01.2, name: "Melihat sorotan konten beranda", description: "Ringkasan keahlian, cuplikan project unggulan, tulisan terbaru, dan ajakan menghubungi/unduh CV tampil; tiap sorotan mengarah ke halaman lengkapnya (komposisi fitur yang ada — susunan/urutan milik UI/UX)" }
  - id: F-02
    name: "Halaman About"
    description: "Perkenalan singkat pemilik (About Hero) serta cara berpikir dan cara bekerjanya (v1.3, D006); keahlian tidak diulang di sini, cukup di Home (F-01.2)"
    priority: must
    source: "pm_01_project.md > Core Features > Halaman About (v1.3, D006)"
    sub:
      - { id: F-02.1, name: "Melihat perkenalan diri (About Hero)", description: "Foto, profesi, dan perkenalan singkat pemilik tampil" }
      - { id: F-02.2, name: "Melihat Engineering Principles", description: "Prinsip kerja teknis yang dipegang pemilik tampil" }
      - { id: F-02.3, name: "Melihat Development Workflow", description: "Alur kerja pemilik saat membangun sebuah project tampil" }
      - { id: F-02.4, name: "Melihat Current Focus", description: "Hal yang sedang dipelajari/difokuskan pemilik saat ini tampil" }
      - { id: F-02.5, name: "Melihat Beyond Code", description: "Sisi personal pemilik di luar coding (minat/kegiatan) tampil" }
  - id: F-03
    name: "Halaman Portfolio"
    description: "Pengunjung melihat kumpulan project pemilik dan membuka detailnya"
    priority: must
    source: "pm_01_project.md > Core Features > Halaman Portfolio"
    sub:
      - { id: F-03.1, name: "Melihat daftar project", description: "Kumpulan project berstatus Terbit tampil dengan nama & gambaran singkat; kondisi belum-ada-project (Terbit) ditangani wajar (A-010)" }
      - { id: F-03.2, name: "Melihat detail project", description: "Satu project dibuka: deskripsi (dapat memuat peran pemilik), tautan bila ada (A-001, A-012)" }
  - id: F-04
    name: "Halaman Blog"
    description: "Pengunjung melihat daftar tulisan pemilik dan membacanya"
    priority: must
    source: "pm_01_project.md > Core Features > Halaman Blog"
    sub:
      - { id: F-04.1, name: "Melihat daftar tulisan", description: "Daftar tulisan berstatus Terbit tampil urut terbaru (A-002); kondisi kosong (Terbit) ditangani wajar" }
      - { id: F-04.2, name: "Membaca satu tulisan", description: "Isi tulisan tampil utuh; tanpa fitur komentar (Out of Scope)" }
  - id: F-05
    name: "Halaman Contact"
    description: "Pengunjung menemukan info kontak dan dapat mengirim pesan lewat formulir"
    priority: must
    source: "pm_01_project.md > Core Features > Halaman Contact"
    sub:
      - { id: F-05.1, name: "Melihat info kontak", description: "Info kontak (sesuai yang dikelola admin) tampil" }
      - { id: F-05.2, name: "Mengirim pesan lewat formulir", description: "Pengunjung mengisi formulir; pesan tersimpan ke kotak pesan halaman admin (v1.1)" }
  - id: F-06
    name: "Pengelolaan Konten oleh Admin"
    description: "Area terlindung tempat pemilik mengelola seluruh konten tanpa bantuan teknis"
    priority: must
    source: "pm_01_project.md > Core Features > Pengelolaan konten oleh admin"
    sub:
      - { id: F-06.1, name: "Masuk ke halaman admin", description: "Hanya admin ber-akun yang dapat masuk; jalur gagal ditangani" }
      - { id: F-06.2, name: "Mengelola project", description: "Menambah, mengubah, menghapus project; siklus kelola tersirat dari 'CMS lengkap'; mengatur status tayang Draf/Terbit/Arsip lewat satu isian di form (A-010, v1.5 D008)" }
      - { id: F-06.3, name: "Mengelola tulisan blog", description: "Menambah, mengubah, menghapus tulisan; mengatur status tayang Draf/Terbit/Arsip, pola sama Project (A-010, v1.5 D008)" }
      - { id: F-06.4, name: "Mengelola keahlian", description: "Menambah, mengubah, menghapus keahlian (nama + ikon) yang tampil di ringkasan Home (F-01.2); data identitas pemilik (About Hero, Engineering Principles, Development Workflow, Current Focus, Beyond Code) TIDAK dikelola dari sini — bersifat statis (pm_01 D007)" }
      - { id: F-06.5, name: "Mengubah info kontak", description: "Info kontak halaman Contact diperbarui admin" }
      - { id: F-06.6, name: "Keluar dari halaman admin", description: "Admin mengakhiri sesi kerjanya" }
      - { id: F-06.7, name: "Membaca pesan masuk", description: "Admin melihat daftar pesan dari formulir Contact dan membaca isinya (v1.1); pesan otomatis tertandai dibaca saat dibuka, dapat diarsipkan admin tanpa dihapus (A-011, v1.5 D008)" }
      - { id: F-06.8, name: "Mengelola tag", description: "Menambah, mengubah, menghapus tag (nama) dipakai bersama Project & Tulisan — halaman kelola tersendiri, mencabut G-014 lama (inline-only); referensi desain admin client (pm_01 D009, v1.6)" }
      - { id: F-06.9, name: "Mengelola media", description: "Mengunggah gambar lewat halaman Media tersendiri, melihat galeri seluruh gambar pernah diunggah, menghapus bila tidak dipakai lagi (pm_01 D009, v1.6)" }
      - { id: F-06.10, name: "Mengubah kata sandi", description: "Admin mengganti kata sandi akunnya sendiri — kata sandi awal dari developer, dapat diganti mandiri (pm_01 D009, v1.6)" }
  - id: F-07
    name: "Unduh CV"
    description: "Pengunjung mengunduh CV terbaru pemilik dalam satu aksi"
    priority: should
    source: "pm_01_project.md > Core Features > Unduh CV"
    sub:
      - { id: F-07.1, name: "Mengunduh CV", description: "Berkas CV terunduh dan dapat dibuka" }

later_features: []   # pm_01_project.md tidak memuat fitur Later

user_stories:
  - { id: US-001, feature: F-01.1, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "langsung melihat siapa pemilik website dan menuju bagian yang saya butuhkan saat pertama membuka",
      so_that: "saya cepat memahami kandidat tanpa membuang waktu" }
  - { id: US-002, feature: F-02.1, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "melihat perkenalan singkat pemilik website",
      so_that: "saya mengenal sosok di balik portfolio ini" }
  - { id: US-020, feature: [F-02.2, F-02.3, F-02.4, F-02.5], priority: must, as: "HRD / recruiter perusahaan",
      i_want: "melihat cara berpikir dan cara bekerja pemilik (prinsip teknis, alur kerja, fokus saat ini, dan sisi personal)",
      so_that: "saya dapat menilai kecocokan karakter dan budaya kerja kandidat, bukan cuma kemampuan teknisnya" }
  - { id: US-003, feature: F-03.1, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "melihat daftar project kandidat dalam satu tempat",
      so_that: "saya dapat menilai kemampuannya dengan cepat" }
  - { id: US-004, feature: F-03.2, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "membuka detail sebuah project",
      so_that: "saya yakin dengan kualitas dan peran kandidat di dalamnya" }
  - { id: US-005, feature: F-04.1, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "melihat daftar tulisan kandidat",
      so_that: "saya melihat sisi lain kandidat yang membuatnya menonjol dibanding pelamar lain" }
  - { id: US-006, feature: F-04.2, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "membaca satu tulisan secara utuh",
      so_that: "saya dapat menilai cara berpikir dan berkomunikasinya" }
  - { id: US-007, feature: F-05.1, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "melihat info kontak pemilik",
      so_that: "saya dapat menghubunginya untuk proses rekrutmen" }
  - { id: US-008, feature: F-05.2, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "mengirim pesan langsung dari website",
      so_that: "saya dapat menghubungi kandidat tanpa berpindah aplikasi" }
  - { id: US-009, feature: F-06.1, priority: must, as: "Admin (pemilik website)",
      i_want: "masuk ke halaman admin dengan akun saya",
      so_that: "hanya saya yang dapat mengubah isi website" }
  - { id: US-010, feature: F-06.2, priority: must, as: "Admin (pemilik website)",
      i_want: "menambah project baru",
      so_that: "portfolio saya selalu mencerminkan karya terbaru tanpa bantuan teknis" }
  - { id: US-011, feature: F-06.2, priority: must, as: "Admin (pemilik website)",
      i_want: "mengubah, menghapus, atau mengatur status tayang (Draf/Terbit/Arsip) project yang sudah ada",
      so_that: "saya dapat memperbaiki, mencabut, atau menyembunyikan sementara karya yang belum siap/tidak lagi relevan" }
  - { id: US-012, feature: F-06.3, priority: must, as: "Admin (pemilik website)",
      i_want: "menulis tulisan baru dan memilih menyimpannya sebagai draf atau langsung menerbitkannya",
      so_that: "saya dapat berbagi tulisan yang memperkuat citra profesional saya tanpa terburu-buru menayangkan yang belum selesai" }
  - { id: US-013, feature: F-06.3, priority: must, as: "Admin (pemilik website)",
      i_want: "mengubah, menghapus, atau mengatur status tayang tulisan yang sudah terbit",
      so_that: "isi blog saya tetap akurat, layak dibaca, dan bisa disembunyikan sementara tanpa dihapus" }
  - { id: US-014, feature: F-06.4, priority: must, as: "Admin (pemilik website)",
      i_want: "menambah, mengubah, atau menghapus keahlian saya",
      so_that: "ringkasan keahlian di Home selalu menggambarkan kemampuan saya terkini" }
  - { id: US-015, feature: F-06.5, priority: must, as: "Admin (pemilik website)",
      i_want: "mengubah info kontak yang tampil",
      so_that: "recruiter selalu menghubungi saya lewat saluran yang benar" }
  - { id: US-016, feature: F-06.6, priority: must, as: "Admin (pemilik website)",
      i_want: "keluar dari halaman admin setelah selesai",
      so_that: "orang lain yang memakai perangkat saya tidak dapat mengubah isi website" }
  - { id: US-017, feature: F-07.1, priority: should, as: "HRD / recruiter perusahaan",
      i_want: "mengunduh CV terbaru kandidat",
      so_that: "saya dapat membawanya ke proses rekrutmen internal" }
  - { id: US-018, feature: F-06.7, priority: must, as: "Admin (pemilik website)",
      i_want: "membaca pesan yang dikirim pengunjung lewat formulir Contact dan merapikan kotak pesan dengan mengarsipkan yang sudah ditindaklanjuti",
      so_that: "saya tidak melewatkan peluang yang datang lewat website dan kotak pesan tetap mudah dipantau" }
  - { id: US-019, feature: F-01.2, priority: must, as: "HRD / recruiter perusahaan",
      i_want: "melihat sorotan keahlian, project unggulan, dan tulisan terbaru langsung di halaman depan",
      so_that: "saya menangkap gambaran kandidat dengan cepat tanpa menjelajah semua halaman" }
  - { id: US-021, feature: F-06.8, priority: must, as: "Admin (pemilik website)",
      i_want: "menambah, mengubah, atau menghapus tag",
      so_that: "label yang dipakai di Project dan Tulisan tetap rapi dan konsisten" }
  - { id: US-022, feature: F-06.9, priority: must, as: "Admin (pemilik website)",
      i_want: "mengunggah gambar dan melihat semua gambar yang pernah saya unggah dalam satu galeri",
      so_that: "saya bisa memakai ulang gambar tanpa mengunggah dobel" }
  - { id: US-023, feature: F-06.10, priority: must, as: "Admin (pemilik website)",
      i_want: "mengubah kata sandi akun saya sendiri",
      so_that: "saya bisa mengganti kata sandi awal dari developer sesuai kebutuhan saya" }

acceptance_criteria:
  - { id: AC-001-1, story: US-001,
      given: "Pengunjung membuka website",
      when: "Halaman Home terbuka",
      then: "Nama dan profesi pemilik tampil, dan tersedia jalan menuju About, Portfolio, Blog, dan Contact" }
  - { id: AC-001-2, story: US-001,
      given: "Pengunjung membuka website dari ponsel",
      when: "Pengunjung menjelajah halaman Home",
      then: "Seluruh isi terbaca tanpa perlu menggeser layar ke samping atau memperbesar tampilan" }
  - { id: AC-001-3, story: US-001,
      given: "Pengunjung membuka halaman mana pun",
      when: "Pengunjung membaca isinya",
      then: "Seluruh teks berbahasa Indonesia" }
  - { id: AC-001-4, story: US-001,
      given: "Website telah tayang dan dapat diakses publik",
      when: "Nama pemilik dicari di Google",
      then: "Website ini muncul di hasil pencarian" }
  - { id: AC-002-1, story: US-002,
      given: "Pengunjung membuka website",
      when: "Pengunjung membuka halaman About",
      then: "Foto (bila ada), profesi, dan perkenalan singkat pemilik tampil" }
  - { id: AC-020-1, story: US-020,
      given: "Pengunjung berada di halaman About",
      when: "Halaman dimuat",
      then: "Engineering Principles (prinsip kerja teknis pemilik) tampil — teks statis (pm_01 D007)" }
  - { id: AC-020-2, story: US-020,
      given: "Pengunjung berada di halaman About",
      when: "Halaman dimuat",
      then: "Development Workflow (alur kerja pemilik) tampil — teks statis (pm_01 D007)" }
  - { id: AC-020-3, story: US-020,
      given: "Pengunjung berada di halaman About",
      when: "Halaman dimuat",
      then: "Current Focus (fokus yang sedang dipelajari/dikerjakan pemilik saat ini) tampil — teks statis (pm_01 D007)" }
  - { id: AC-020-4, story: US-020,
      given: "Pengunjung berada di halaman About",
      when: "Halaman dimuat",
      then: "Beyond Code (sisi personal pemilik di luar coding) tampil — teks statis (pm_01 D007)" }
  - { id: AC-003-1, story: US-003,
      given: "Sudah ada project berstatus Terbit",
      when: "Pengunjung membuka halaman Portfolio",
      then: "Daftar project tampil; tiap project menunjukkan nama dan gambaran singkat — project berstatus Draf/Arsip tidak ikut tampil" }
  - { id: AC-003-2, story: US-003,
      given: "Belum ada project berstatus Terbit (termasuk bila yang ada baru Draf/Arsip)",
      when: "Pengunjung membuka halaman Portfolio",
      then: "Halaman tetap tampil wajar dengan keterangan bahwa belum ada project" }
  - { id: AC-004-1, story: US-004,
      given: "Pengunjung berada di daftar project",
      when: "Pengunjung memilih satu project",
      then: "Detail project tampil: deskripsi (dapat memuat peran pemilik bila ditulis admin di sana, G-013) dan tautan bila ada" }
  - { id: AC-005-1, story: US-005,
      given: "Sudah ada tulisan berstatus Terbit",
      when: "Pengunjung membuka halaman Blog",
      then: "Daftar tulisan tampil urut dari yang terbaru — tulisan berstatus Draf/Arsip tidak ikut tampil" }
  - { id: AC-005-2, story: US-005,
      given: "Belum ada tulisan berstatus Terbit (termasuk bila yang ada baru Draf/Arsip)",
      when: "Pengunjung membuka halaman Blog",
      then: "Halaman tetap tampil wajar dengan keterangan bahwa belum ada tulisan" }
  - { id: AC-006-1, story: US-006,
      given: "Pengunjung berada di daftar tulisan",
      when: "Pengunjung memilih satu tulisan",
      then: "Isi tulisan tampil utuh dan dapat dibaca" }
  - { id: AC-006-2, story: US-006,
      given: "Pengunjung membaca sebuah tulisan",
      when: "Pengunjung mencari cara meninggalkan komentar",
      then: "Tidak ada fitur komentar di mana pun (sesuai Out of Scope)" }
  - { id: AC-007-1, story: US-007,
      given: "Pengunjung ingin menghubungi pemilik",
      when: "Pengunjung membuka halaman Contact",
      then: "Info kontak yang dikelola admin tampil" }
  - { id: AC-008-1, story: US-008,
      given: "Pengunjung berada di halaman Contact",
      when: "Pengunjung mengisi formulir dengan lengkap lalu mengirimnya",
      then: "Pengunjung melihat tanda pesan terkirim, dan pesan itu muncul di kotak pesan halaman admin" }
  - { id: AC-008-2, story: US-008,
      given: "Pengunjung berada di halaman Contact",
      when: "Pengunjung mengirim formulir dengan isian wajib kosong",
      then: "Pesan tidak terkirim dan pengunjung melihat pemberitahuan bagian yang harus diisi" }
  - { id: AC-009-1, story: US-009,
      given: "Admin memiliki akun",
      when: "Admin memasukkan data masuk yang benar",
      then: "Admin berada di halaman admin dan dapat mulai mengelola konten" }
  - { id: AC-009-2, story: US-009,
      given: "Admin berada di halaman masuk",
      when: "Admin memasukkan data masuk yang salah",
      then: "Admin tidak masuk dan melihat pemberitahuan bahwa data masuknya keliru" }
  - { id: AC-009-3, story: US-009,
      given: "Seseorang belum masuk sebagai admin",
      when: "Ia mencoba membuka halaman admin",
      then: "Halaman pengelolaan tidak dapat diakses" }
  - { id: AC-010-1, story: US-010,
      given: "Admin berada di halaman admin",
      when: "Admin menambah project baru dengan lengkap, memilih status Terbit, lalu menyimpannya",
      then: "Project tampil di halaman Portfolio publik; bila status yang dipilih Draf, project tersimpan namun belum tampil publik (default status konten baru = Draf, G-011)" }
  - { id: AC-010-2, story: US-010,
      given: "Admin sedang menambah project",
      when: "Admin menyimpan tanpa mengisi bagian wajib",
      then: "Project tidak tersimpan dan admin melihat pemberitahuan bagian yang harus diisi" }
  - { id: AC-011-1, story: US-011,
      given: "Ada project yang sudah tersimpan",
      when: "Admin mengubahnya lalu menyimpan",
      then: "Halaman Portfolio publik menampilkan versi terbaru" }
  - { id: AC-011-2, story: US-011,
      given: "Ada project yang sudah tersimpan",
      when: "Admin menghapusnya",
      then: "Muncul konfirmasi dulu; setelah dikonfirmasi, project hilang dari halaman publik" }
  - { id: AC-011-3, story: US-011,
      given: "Ada project berstatus Draf",
      when: "Admin mengubah statusnya jadi Terbit lalu menyimpan",
      then: "Project mulai tampil di halaman Portfolio publik" }
  - { id: AC-011-4, story: US-011,
      given: "Ada project berstatus Terbit",
      when: "Admin mengubah statusnya jadi Arsip lalu menyimpan",
      then: "Project hilang dari halaman Portfolio publik namun tetap ada (tidak terhapus) di halaman Kelola Project — status dapat dikembalikan ke Terbit kapan saja" }
  - { id: AC-012-1, story: US-012,
      given: "Admin berada di halaman admin",
      when: "Admin menulis tulisan baru (judul & isi), memilih status Terbit, lalu menyimpannya",
      then: "Tulisan langsung tampil di halaman Blog publik sebagai yang terbaru; bila status yang dipilih Draf, tulisan tersimpan namun belum tampil publik (default status konten baru = Draf, G-011)" }
  - { id: AC-012-2, story: US-012,
      given: "Admin sedang menulis tulisan",
      when: "Admin menyimpan tanpa mengisi judul",
      then: "Tulisan tidak tersimpan dan admin melihat pemberitahuan bagian yang harus diisi" }
  - { id: AC-013-1, story: US-013,
      given: "Ada tulisan yang sudah terbit",
      when: "Admin mengubahnya lalu menyimpan",
      then: "Halaman Blog publik menampilkan versi terbaru tulisan itu" }
  - { id: AC-013-2, story: US-013,
      given: "Ada tulisan yang sudah terbit",
      when: "Admin menghapusnya",
      then: "Muncul konfirmasi dulu; setelah dikonfirmasi, tulisan hilang dari halaman publik" }
  - { id: AC-013-3, story: US-013,
      given: "Ada tulisan berstatus Draf",
      when: "Admin mengubah statusnya jadi Terbit lalu menyimpan",
      then: "Tulisan mulai tampil di halaman Blog publik" }
  - { id: AC-013-4, story: US-013,
      given: "Ada tulisan berstatus Terbit",
      when: "Admin mengubah statusnya jadi Arsip lalu menyimpan",
      then: "Tulisan hilang dari halaman Blog publik namun tetap ada (tidak terhapus) di halaman Kelola Tulisan — status dapat dikembalikan ke Terbit kapan saja" }
  - { id: AC-014-1, story: US-014,
      given: "Admin berada di halaman admin",
      when: "Admin menambah keahlian baru (nama + ikon) lalu menyimpan",
      then: "Keahlian tampil di ringkasan Home" }
  - { id: AC-014-2, story: US-014,
      given: "Ada keahlian yang sudah tersimpan",
      when: "Admin mengubah atau menghapusnya",
      then: "Ringkasan Home menampilkan versi terbaru; hapus selalu lewat konfirmasi dulu" }
  - { id: AC-015-1, story: US-015,
      given: "Admin berada di halaman admin",
      when: "Admin mengubah info kontak lalu menyimpan",
      then: "Halaman Contact menampilkan info kontak terbaru" }
  - { id: AC-016-1, story: US-016,
      given: "Admin sedang masuk di halaman admin",
      when: "Admin keluar",
      then: "Halaman admin tidak lagi dapat diakses tanpa masuk kembali" }
  - { id: AC-017-1, story: US-017,
      given: "Pengunjung membuka website",
      when: "Pengunjung memakai aksi unduh CV",
      then: "Berkas CV terunduh dan dapat dibuka" }
  - { id: AC-018-1, story: US-018,
      given: "Ada pesan yang pernah dikirim lewat formulir Contact",
      when: "Admin membuka kotak pesan di halaman admin",
      then: "Daftar pesan tampil urut dari yang terbaru; tiap pesan menunjukkan nama, alamat email pengirim, dan isinya" }
  - { id: AC-018-2, story: US-018,
      given: "Belum ada pesan yang masuk",
      when: "Admin membuka kotak pesan",
      then: "Kotak pesan tampil wajar dengan keterangan belum ada pesan" }
  - { id: AC-018-3, story: US-018,
      given: "Ada pesan berstatus belum dibaca",
      when: "Admin membuka/melihat pesan tersebut di kotak pesan",
      then: "Status pesan otomatis berubah jadi sudah dibaca, tanpa aksi manual terpisah" }
  - { id: AC-018-4, story: US-018,
      given: "Ada pesan yang sudah ditindaklanjuti admin",
      when: "Admin mengarsipkannya",
      then: "Pesan pindah dari daftar utama ke daftar arsip, tidak terhapus, dan dapat dikembalikan ke daftar utama kapan saja" }
  - { id: AC-019-1, story: US-019,
